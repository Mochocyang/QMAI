<!DOCTYPE html>
<html lang="zh-CN" data-qmai-layout="editorial-v2">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>章纲卡片流</title>
<style>
:root{
  --bg:#FFFFFF;--surface:#FBF8F5;--surface2:#F4EEE8;--ink:#241E1A;--ink2:#4A3F38;--muted:#7A6C63;
  --border:#E2D8CF;--brand:#B8551D;--brand-soft:#FBF0E9;--brand-soft2:#F6E0D2;--brand-text:#8A3F13;--on-brand:#FFFFFF;
  --qi:#8E6E63;--cheng:#D97757;--zhuan:#B8551D;--he:#F59E42;
  --ok:#3C7A3C;--ok-soft:#EEF7EE;--ok-border:#B7DFB7;--warn:#96601A;--warn-soft:#FFF7E6;--danger:#A8071A;--danger-soft:#FFF1F0;--danger-border:#FFCCC7;
  --day:#7FB07F;
  --k-qi-bg:#F1EDE9;--k-qi-ink:#5F4A3E;--k-cheng-bg:#FBEDE6;--k-cheng-ink:#A8451C;--k-he-bg:#FEF3E2;--k-he-ink:#96601A;
  --beat-flat-bg:#F4EEE8;--beat-flat-border:#E2D8CF;--beat-flat-ink:#5F4A3E;
  --beat-rise-bg:#FBEDE6;--beat-rise-border:#F0CDB8;--beat-rise-ink:#A8451C;
  --beat-tight-bg:#F6E0D2;--beat-tight-border:#E0A87E;--beat-tight-ink:#8A3F13;
  --beat-fall-bg:#EFEAE6;--beat-fall-border:#D8CCC2;--beat-fall-ink:#6B5548;
  --beat-hang-bg:#FFF7E6;--beat-hang-ink:#96601A;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.intro{background:var(--brand-soft);border-bottom:1px solid var(--border);padding:40px 0 32px}
.intro .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--brand-text);font-weight:600;margin:0 0 12px}
.intro h1{margin:0 0 12px;font-size:26px;line-height:1.35}
.chip{display:inline-flex;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--ink2);margin:10px 6px 0 0}
.chip b{color:var(--brand-text)}

/* 故事骨架卡 */
.story-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:12px}
.story-card .kv{border-bottom:none;padding:3px 0}
.story-card .beatrow{display:flex;gap:10px;align-items:flex-start;padding:4px 0 2px;flex-wrap:wrap}
.story-card .kk{flex:none;width:72px;color:var(--muted);font-size:11.5px}

/* 面板 */
.panels{margin:14px 0 0}
.panel{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px 16px 16px;margin-bottom:12px}
.panel h2{margin:0 0 10px;font-size:14.5px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h2 .pn{font-size:11.5px;font-weight:400;color:var(--muted)}
.panel .empty{margin:0;font-size:12.5px;color:var(--warn);background:var(--warn-soft);border:1px dashed var(--he);border-radius:8px;padding:8px 10px}
.panel .hint{margin:0;font-size:12px;color:var(--muted)}
.panel .okbox{margin:0;font-size:12.5px;color:var(--ok);background:var(--ok-soft);border:1px solid var(--ok-border);border-radius:8px;padding:10px 12px}

/* 键值行 */
.kv{display:flex;gap:10px;align-items:baseline;padding:5px 9px;border-bottom:1px dashed var(--border);font-size:12.5px;line-height:1.6}
.kv:last-child{border-bottom:none}
.kv .kk{flex:none;width:86px;color:var(--muted);font-size:11.5px}
.kv .vv{flex:1;min-width:0;color:var(--ink2)}

/* 表格 */
.mxwrap{overflow:auto;border:1px solid var(--border);border-radius:9px;margin-top:4px}
table.mx{border-collapse:collapse;width:100%;font-size:12px}
table.mx th,table.mx td{border-bottom:1px solid var(--border);padding:5px 8px;text-align:left;vertical-align:top;line-height:1.55}
table.mx thead th{background:var(--surface);color:var(--muted);font-weight:600;font-size:11px;white-space:nowrap;position:sticky;top:0}
table.mx tbody tr:last-child td{border-bottom:none}
table.mx td{color:var(--ink2)}
table.mx td.mxh,table.mx th.mxh{font-weight:600;color:var(--ink);white-space:nowrap;background:var(--surface)}

/* 锚点导航 */
.nav{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin:14px 0 0}
.nav .navt{font-size:11.5px;color:var(--muted);margin-right:4px}
.navlink{display:inline-flex;gap:6px;align-items:baseline;font-size:12px;color:var(--ink2);text-decoration:none;border:1px solid var(--border);border-radius:999px;padding:2px 10px;background:var(--surface);max-width:260px;overflow:hidden;white-space:nowrap}
.navlink b{font-size:10.5px;color:var(--on-brand);background:var(--brand);border-radius:4px;padding:0 5px;flex:none}
.navlink:hover{border-color:var(--brand);color:var(--brand-text)}

/* 章节卡流 */
.cards{margin:14px 0 40px;display:flex;flex-direction:column;gap:10px}
details.cc{background:var(--bg);border:1px solid var(--border);border-radius:12px;overflow:hidden}
details.cc[open]{border-color:var(--brand)}
details.cc>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:11px 14px;background:var(--surface)}
details.cc>summary::-webkit-details-marker{display:none}
details.cc>summary::marker{content:""}
details.cc>summary::before{content:"▸";color:var(--muted);font-size:11px}
details.cc[open]>summary::before{content:"▾"}
details.cc>summary:hover{background:var(--surface2)}
.cno{font-size:11px;font-weight:700;color:var(--on-brand);background:var(--brand);border-radius:5px;padding:1px 8px;flex:none}
.ct{font-weight:600;font-size:14px}
.cgoal{font-size:12px;color:var(--muted);flex:1;min-width:200px}
.cbody{padding:6px 14px 14px}
.csec{padding:8px 0;border-bottom:1px dashed var(--border)}
.csec:last-child{border-bottom:none}
.csec h4{margin:0 0 6px;font-size:12.5px;color:var(--brand-text)}
.clist{margin:0;padding-left:20px;font-size:12.5px;color:var(--ink2);line-height:1.65}
.clist li{margin:2px 0}
details.cc:target{outline:2px solid var(--brand);outline-offset:2px}

/* 标签 */
.tag{font-size:10.5px;border-radius:999px;padding:1px 8px;border:1px solid var(--border);color:var(--muted);background:var(--surface);flex:none}
.tag.exp{background:var(--warn-soft);border-color:var(--he);color:var(--warn);font-weight:600}
.tag.attr{background:var(--brand-soft2);border-color:var(--brand);color:var(--brand-text);font-weight:600}
.tag.mood{background:var(--k-qi-bg);border-color:var(--border);color:var(--k-qi-ink)}
.tag.chap{background:var(--surface2);color:var(--ink2);font-weight:600}

/* 节拍 */
.beats{display:flex;flex-wrap:wrap;gap:4px;padding:4px 0}
.bt{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border:1px solid var(--border);border-radius:6px;padding:2px 7px;background:var(--bg);line-height:1.5}
.bt[data-b="平"],.bt[data-b="缓"]{background:var(--beat-flat-bg);border-color:var(--beat-flat-border);color:var(--beat-flat-ink)}
.bt[data-b="升"],.bt[data-b="起"]{background:var(--beat-rise-bg);border-color:var(--beat-rise-border);color:var(--beat-rise-ink)}
.bt[data-b="紧"]{background:var(--beat-tight-bg);border-color:var(--beat-tight-border);color:var(--beat-tight-ink)}
.bt[data-b="顶"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.bt[data-b="落"]{background:var(--beat-fall-bg);border-color:var(--beat-fall-border);color:var(--beat-fall-ink)}
.bt[data-b="悬"]{background:var(--beat-hang-bg);border-color:var(--he);color:var(--beat-hang-ink)}

/* 情绪曲线 */
.svgwrap{overflow:auto;border:1px solid var(--border);border-radius:9px;background:var(--surface)}
.svgwrap svg{display:block;width:100%;min-width:880px;height:220px}
svg .cg{stroke:var(--border);stroke-width:1}
svg .ct{fill:var(--muted);font-size:11px}
svg .cl{fill:none;stroke:var(--brand);stroke-width:2}
svg .ca{fill:var(--brand-soft);opacity:.7}
svg .cp{fill:var(--he);stroke:var(--bg);stroke-width:1}
.ecap{margin:8px 0 0;font-size:12px;color:var(--muted);line-height:1.6}

/* 一致性体检 */
.chk{padding:6px 9px;border-bottom:1px dashed var(--border)}
.chk:last-child{border-bottom:none}
.chkh{font-size:11.5px;font-weight:700;color:var(--brand-text);margin-bottom:2px}
.issues{margin:0;padding-left:18px;font-size:12px;color:var(--danger);line-height:1.6}
.issues li{margin:2px 0}

/* 第二版批准方案：保留原有结构化面板、曲线与折叠树，只对齐阅读语言。 */
:root{--font-heading:"Noto Serif CJK SC","Source Han Serif SC","Songti SC","SimSun",serif;--bg:#fffefa;--surface:#f5f3ed;--surface2:#e7ebdf;--ink:#253a42;--ink2:#435852;--muted:#596863;--border:#d9d9ce;--brand:#876533;--brand-text:#765929;--brand-soft:#ede8da;--brand-soft2:#dfd4bd;--on-brand:#fffefa}
body{background:var(--surface);line-height:1.9}.wrap{max-width:1280px;padding:0 30px}.intro{background:var(--surface);padding:38px 0 28px}.intro h1{font:600 36px/1.5 var(--font-heading);letter-spacing:.05em}.intro .eyebrow{font-size:11px;letter-spacing:.16em}.intro p{max-width:80ch;line-height:1.95}.panel{padding:22px 24px;border-radius:3px;box-shadow:none;margin-bottom:20px}.panel h2{font-family:var(--font-heading);font-size:21px}.tree,details.cc{border-radius:3px;box-shadow:none}.nav{padding:16px 20px;border-radius:3px}.navlink{line-height:1.9}.navlink:focus-visible,summary:focus-visible{outline:2px solid var(--brand);outline-offset:3px}.kv{font-size:13px;line-height:1.9;padding-top:7px;padding-bottom:7px}table.mx th,table.mx td{padding:10px 12px;line-height:1.9;overflow-wrap:anywhere}.mxwrap{max-width:100%;overflow:auto}.cards{margin-bottom:45px}
@media (max-width: 760px){.wrap{padding:0 17px}.intro{padding:26px 0}.intro h1{font-size:28px}.panel{padding:17px}.mxwrap table{min-width:540px}.kv .kk{max-width:35%}}
@media print{.wrap{max-width:none;padding:0}.panel,.tree,details.cc{box-shadow:none}.mxwrap{overflow:visible}.mxwrap table{min-width:0}.intro{padding:12px 0}details::details-content{content-visibility:visible!important;block-size:auto!important;height:auto!important}}
</style>
</head>
<body>

<header class="intro">
  <div class="wrap">
    <p class="eyebrow">章纲卡片流 · 17 节标准 × 卷纲骨架对齐</p>
    <h1>__CHAPTER_TITLE__</h1>
    __CHAPTER_SUMMARY__
    <div>__CHAPTER_CHIPS__</div>
  </div>
</header>

<div class="wrap">
  <section class="panels">
__CHAPTER_ALIGN__
__CHAPTER_EXPECT__
__CHAPTER_FORES__
__CHAPTER_SCENE__
__CHAPTER_CURVE__
__CHAPTER_CHECK__
  </section>
  __CHAPTER_NAV__
  <main class="cards">
__CHAPTER_CARDS__
  </main>
</div>

</body>
</html>
