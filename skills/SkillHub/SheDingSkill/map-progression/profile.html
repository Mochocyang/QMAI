<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地理设定 · 地理卡</title>
<style>
:root{
  --bg:#FFFFFF;--surface:#FBF8F5;--surface2:#F4EEE8;--ink:#241E1A;--ink2:#4A3F38;--muted:#7A6C63;
  --paper:#EDF3F1;
  --border:#E2D8CF;--brand:#B8551D;--brand-soft:#FBF0E9;--brand-soft2:#F6E0D2;--brand-text:#8A3F13;--on-brand:#FFFFFF;
  --ok:#3C7A3C;--ok-soft:#EEF7EE;--ok-border:#B7DFB7;--warn:#96601A;--warn-soft:#FFF7E6;--danger:#A8071A;--danger-soft:#FFF1F0;--danger-border:#FFCCC7;
  --he:#F59E42;--hero-a:#16302E;--hero-b:#2F6B63;--grid:rgba(255,255,255,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* 地理头图（经纬网格感） */
.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;padding:42px 0 34px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:34px 34px;mask-image:radial-gradient(120% 100% at 80% 0%,#000 0%,transparent 78%)}
.hero .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#CDE6E0;font-weight:600;margin:0 0 12px;position:relative}
.hero h1{margin:0 0 10px;font-size:30px;line-height:1.3;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;position:relative}
.hero .role{font-size:13px;font-weight:700;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:3px 12px}
.hero .tagline{margin:0;max-width:78ch;color:#CDE6E0;font-size:14.5px;position:relative}
.hero .chip{display:inline-flex;gap:6px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.32);border-radius:999px;padding:4px 11px;font-size:12px;color:#fff;margin:12px 6px 0 0;position:relative}
.chip b{font-weight:700}

/* 概览面板 */
.panels{margin:14px 0 0}
.panel{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px 16px 16px;margin-bottom:12px;border-left:3px solid #2F6B63}
.panel h2{margin:0 0 10px;font-size:14.5px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h2 .pn{font-size:11.5px;font-weight:400;color:var(--muted)}
.kv{display:flex;gap:10px;align-items:baseline;padding:5px 9px;border-bottom:1px dashed var(--border);font-size:12.5px;line-height:1.6}
.kv:last-child{border-bottom:none}
.kv .kk{flex:none;width:96px;color:var(--muted);font-size:11.5px}
.kv .vv{flex:1;min-width:0;color:var(--ink2)}
.hint{margin:0;font-size:12px;color:var(--muted)}
.empty{margin:0;font-size:12.5px;color:var(--warn);background:var(--warn-soft);border:1px dashed var(--he);border-radius:8px;padding:8px 10px}

/* 分区导航（锚点直达，卷纲/章纲同款） */
.pnav{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:9px 14px;margin-bottom:16px;box-shadow:0 1px 2px rgba(36,30,26,.04)}
.pnav .navt{font-size:11.5px;color:var(--muted);margin-right:2px}
.pnav .pn{flex:none;font-size:10.5px;color:var(--muted);background:var(--surface2);border-radius:999px;padding:1px 9px;margin-right:6px}
.pnav .navlink{display:inline-flex;gap:6px;align-items:baseline;font-size:12px;color:var(--ink2);text-decoration:none;border:1px solid var(--border);border-radius:999px;padding:2px 11px;background:var(--bg);max-width:320px;overflow:hidden;white-space:nowrap;transition:border-color .12s,color .12s}
.pnav .navlink b{font-size:10.5px;color:var(--on-brand);background:var(--brand);border-radius:999px;padding:0 6px;flex:none}
.pnav .navlink:hover{border-color:var(--brand);color:var(--brand-text)}

/* 分区卡片（纸面浮卡） */
.profile{margin:0 0 48px}
.pcard{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:16px 22px 20px;margin-top:16px;box-shadow:0 1px 2px rgba(36,30,26,.05),0 12px 32px -22px rgba(36,30,26,.32)}
.pcard.wide{grid-column:1 / -1}
.pcard:target{outline:2px solid var(--brand);outline-offset:3px}
.pcard h3{margin:0 0 6px;font-size:15px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:9px;padding-bottom:11px;border-bottom:2px solid var(--surface2)}
.pcard h3 .no{flex:none;font-size:11px;font-weight:700;color:var(--on-brand);background:var(--brand);border-radius:6px;padding:2px 8px}
.pcard h3 .pn{margin-left:auto;flex:none;font-size:10.5px;font-weight:500;color:var(--muted);background:var(--surface2);border-radius:999px;padding:2px 10px}

/* 短字段 → 迷你信息卡（双列栅格，密度与秩序） */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:10px}
.kv{display:flex;gap:9px;align-items:baseline;padding:7px 11px;background:var(--surface);border:1px solid var(--border);border-radius:9px;font-size:12.3px;line-height:1.6}
.kv .kk{flex:none;max-width:40%;color:var(--muted);font-size:11.3px}
.kv .vv{flex:1;min-width:0;color:var(--ink2)}

/* 长段落 → 编辑部式条目：菱形标记 + 小标题 + 两端对齐正文（双栏流式） */
.entrylist{columns:2;column-gap:34px;margin-top:10px}
.entry{break-inside:avoid;padding:9px 2px 13px;border-bottom:1px solid var(--border)}
.entry:last-child{border-bottom:none}
.entry h4{margin:0 0 5px;font-size:13.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.entry h4::before{content:"";width:7px;height:7px;background:var(--brand);border-radius:2px;transform:rotate(45deg);flex:none}
.entry p{margin:0;font-size:12.6px;color:var(--ink2);line-height:1.85;text-align:justify}

/* 等级 / 阶梯：竖向时间线 + 渐变圆号 */
.pcard.ladder{counter-reset:lad}
.pcard.ladder .entrylist{columns:1;margin-top:12px}
.pcard.ladder .entry{position:relative;padding:0 2px 20px 42px;border-bottom:none}
.pcard.ladder .entry h4{font-size:14px}
.pcard.ladder .entry h4::before{display:none}
.pcard.ladder .entry::before{counter-increment:lad;content:counter(lad);position:absolute;left:0;top:5px;width:26px;height:26px;font-size:11.5px;font-weight:700;color:var(--on-brand);background:linear-gradient(135deg,var(--brand),var(--he,var(--brand)));border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--brand-soft)}
.pcard.ladder .entry:not(:last-child)::after{content:"";position:absolute;left:12px;top:37px;bottom:2px;width:2px;background:linear-gradient(var(--brand-soft2),transparent)}

/* 名册 / 关系：双列人物小卡 */
.pcard.roster .entrylist{columns:2;column-gap:18px}
.pcard.roster .entry{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 13px;margin-bottom:10px;border-bottom:1px solid var(--border)}
.pcard.roster .entry h4::before{background:var(--ok)}

/* 列表（菱形项目符） */
.clist{margin:10px 0 0;padding:0;list-style:none;font-size:12.6px;color:var(--ink2);line-height:1.75}
.clist li{margin:5px 0;padding-left:17px;position:relative}
.clist li::before{content:"";position:absolute;left:2px;top:.7em;width:5px;height:5px;background:var(--brand);border-radius:1px;transform:rotate(45deg)}

/* 语义徽章换色（等级=琥珀 / 名册=绿 / 禁忌=红 / 区域=青） */
.pcard.ladder h3 .no{background:var(--he,var(--brand))}
.pcard.roster h3 .no{background:var(--ok)}
.pcard.matrix h3 .no{background:var(--danger)}
.pcard.map h3 .no{background:#2F6B63}
.pcard.unlock h3 .no{background:var(--ok)}

/* 英雄头图压轴色条 + 空副标题不占位 */
.hero{border-bottom:3px solid var(--brand)}
.tagline:empty{display:none}

/* 表格 */
.pnav .pn{flex:none;font-size:10.5px;font-weight:400;color:var(--muted);background:var(--surface2);border-radius:999px;padding:1px 9px}
.mxwrap{overflow:auto;border:1px solid var(--border);border-radius:9px}
table.mx{border-collapse:collapse;width:100%;font-size:12px}
table.mx th,table.mx td{border-bottom:1px solid var(--border);padding:5px 8px;text-align:left;vertical-align:top;line-height:1.55}
table.mx thead th{background:var(--surface);color:var(--muted);font-weight:600;font-size:11px;white-space:nowrap;position:sticky;top:0}
table.mx tbody tr:last-child td{border-bottom:none}
table.mx td{color:var(--ink2)}
table.mx td.mxh,table.mx th.mxh{font-weight:600;color:var(--ink);white-space:nowrap;background:var(--surface)}

/* 区域 / 地理：方格底纹 + 首列区域块 */
.pcard.map{border-top:3px solid #2F6B63}
.pcard.map .mxwrap{border-color:#CFE3DE;background:
  linear-gradient(180deg,rgba(47,107,99,.06),transparent 44%)}
.pcard.map table.mx.lx{}
.pcard.map table.mx thead th{background:#E8F1EE;color:#2F6B63}
.pcard.map table.mx tbody td:first-child{background:#EFF6F4;color:#22544E;font-weight:700;white-space:nowrap;border-left:3px solid #2F6B63}
.pcard.map table.mx tbody tr:nth-child(even) td:first-child{background:#E3EFEB;border-left-color:var(--he)}

/* 势力分布等：绿色名册调 */
.pcard.roster{border-top:3px solid var(--ok-border)}
.pcard.roster table.mx thead th{background:var(--ok-soft);color:var(--ok)}

/* 约束 / 危险 */
.pcard.matrix{border-top:3px solid var(--danger-border)}
.pcard.matrix table.mx thead th{background:var(--danger-soft);color:var(--danger)}
.pcard.matrix table.mx tbody td{background:#FFFCFA}
.pcard.matrix table.mx tbody td:first-child{font-weight:600;color:var(--ink);background:var(--surface)}

/* 标签 */
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;border-radius:999px;padding:2px 9px;border:1px solid var(--border);color:var(--ink2);background:var(--surface)}
.tag.warn{background:var(--danger-soft);border-color:var(--danger-border);color:var(--danger)}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <p class="eyebrow">__PROFILE_EYEBROW__</p>
    <h1>__PROFILE_NAME____PROFILE_ROLE__</h1>
    <div>__PROFILE_CHIPS__</div>
    <p class="tagline">__PROFILE_TAGLINE__</p>
  </div>
</header>

<div class="wrap">
  <section class="panels">
__PROFILE_OVERVIEW__
  </section>
  <main class="profile">
__PROFILE_SECTIONS__
  </main>
</div>

</body>
</html>
