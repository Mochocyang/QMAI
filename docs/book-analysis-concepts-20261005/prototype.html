const kinds = {characters:{label:"角色 Skill",icon:"UserRound",count:3,object:"许七安",sub:"主角",prompt:"提炼许七安面对权势时的处事方式：先如何判断、何时妥协、什么情况下坚持底线。不继承职业、经历和能力。",brief:"权势压力 · 判断与取舍 · 原型身份隔离",rules:[
 {title:"信息不足时，先核验再下结论",condition:"面对相互矛盾的线索，且有条件进一步核实。",action:"将事实与假设分开，先寻找能验证关键判断的材料，再决定行动；不凭聪明直接得出答案。",boundary:"仅为当前样本中的行为倾向；不赋予目标人物额外专业知识。",chapter:5,quote:"许七安并不确定爆炸的税银一定就是金属钠，这点不重要，重要的是，打开一个思路，来解释税银爆炸的现象。",observation:"先提出可验证的解释方向，没有将初步推测写成已经确定的事实。"},
 {title:"表达克制，关心落在实际行动",condition:"亲近者需要帮助，双方又不愿直接示弱。",action:"先处理对方的实际困难，表达上保留调侃和回避；关心可以通过行动或第三方传达。",boundary:"不能将一次赠礼推断为在所有亲密关系中都回避表达。",chapter:48,quote:"许二叔无奈道：“反正你俩是谁都不肯低头认输，他也不好意思给你。",observation:"经第三人转达心意，嘴上不肯认输与实际付出同时存在。"},
 {title:"底线触发时，愿意承担现实代价",condition:"弱者受到严重伤害，继续回避会纵容伤害发生。",action:"尝试制止伤害，并承担自己的选择造成的后果。具体手段受目标人物当下的能力与处境约束。",boundary:"不是遇到任何冲突都立即硬碰；不继承原作的战力或胜负结果。",chapter:102,quote:"“她还是个孩子”许七安凝视着他：“总有些东西，要高于生命。”",observation:"人物明确表达价值底线；行为的代价与有限能力仍需在新故事里成立。"}
]},story:{label:"故事 Skill",icon:"GitBranch",count:2,object:"弱势开局与信息差",sub:"结构机制",prompt:"研究前20章如何建立弱势处境、投放信息、升级冲突和完成转折。只提炼可复用结构，不搬运原作事件。",brief:"弱势开局 · 信息差 · 转折兑现",rules:[
 {title:"压缩出路，建立清晰的阶段目标",condition:"角色面临明确的处境限制与时间压力。",action:"先呈现主要阻力，再让可行路径逐步收窄，建立可以被读者追踪的阶段目标。",boundary:"每个限制都需要故事内依据，不为增加紧张感凭空堵死出路。",chapter:1,quote:"“我必须想办法自救，我不能就这样狗带。”",observation:"角色的自救目标明确，后续信息与行动围绕这一目标展开。"},
 {title:"让信息改变可行动的选择",condition:"新的材料可以修正旧判断，而不是只补充背景。",action:"信息出现后，让人物重新评估路径，并给出选择变化；转折由信息与行动共同完成。",boundary:"信息差必须可追溯，不能在转折时临时补出决定性证据。",chapter:5,quote:"许七安并不确定爆炸的税银一定就是金属钠，这点不重要，重要的是，打开一个思路，来解释税银爆炸的现象。",observation:"新解释为下一步调查提供方向，而不是直接替代后续验证。"}
]},style:{label:"文风 Skill",icon:"Feather",count:1,object:"对白与短段落节奏",sub:"表达规则",prompt:"分析对白反差、段落长短与信息节奏。区分原文观察和写作建议，不强迫所有场景使用同一套路。",brief:"对白反差 · 动作承接 · 段落节拍",rules:[
 {title:"对白反差留在语气，不搬运身份",condition:"人物之间存在立场差异或不同的表达习惯。",action:"以一方的正式措辞与另一方的口语短句形成反差，语体取自目标人物自身的经历与环境。",boundary:"不是让所有角色都现代化或玩梗，反差要符合目标故事的语境。",chapter:1,quote:"“我必须想办法自救，我不能就这样狗带。”",observation:"严肃处境与口语化内心表达形成反差，此处只观察表达方式。"},
 {title:"动作承接短对白，让语气发生变化",condition:"一个对白回合内出现态度软化或情绪停顿。",action:"用短动作或神态承接对白，让下一句话的力度与上一句形成差别，避免连续解释情绪。",boundary:"不要规定每句话都插动作；只有态度真正变化时才需要停顿。",chapter:48,quote:"许二叔无奈道：“反正你俩是谁都不肯低头认输，他也不好意思给你。",observation:"通过他人转述呈现人物间的僵持，不额外增加长段内心说明。"}
]}};
const descriptions = {A:["推荐 · 日常高频使用","设置与成果同屏，导入、选章、生成不用切换页面。适合连续拆解多个人物或多个章节范围。"],B:["侧重 · 流程清晰","单页四步推进，每次只处理当前步骤。适合第一次拆书，减少同时出现的选项和重复操作。"],C:["侧重 · 成果管理","进入页面先看已有 Skill 与证据；新建分析按需展开。适合已有较多拆书成果、经常修订和复用。"]};
const makeState = () => ({kind:"characters",book:0,start:1,end:20,ids:new Set(Array.from({length:20},(_,i)=>i+1)),requirements:Object.fromEntries(Object.entries(kinds).map(([key,value])=>[key,value.prompt])),step:2,expanded:null,composer:false,revisionOpen:false,job:"done",confirmed:new Set(),query:"",pendingOnly:false,model:0,versions:1,files:[],targets:new Set(["许七安"])});

 return `<div class="tabs" role="tablist" aria-label="${where==="analysis"?"分析类型":"成果类型"}">${Object.entries(kinds).map(([key,k])=>`<button type="button" class="${S().kind===key?"active":""}" role="tab" aria-selected="${S().kind===key}" data-action="kind" data-value="${key}">${icon(k.icon)}${k.label}<span class="tab-count">${k.count}</span></button>`).join("")}</div>`;

function resultItems(){const k=S().kind;if(k==="characters")return [{name:"许七安",sub:"主角 · 人格灵魂",traits:"先核验再判断；嘴硬与关心并存",rules:7,avatar:"许",tone:"",pending:true},{name:"魏渊",sub:"配角 · 人格灵魂",traits:"克制表达；长线判断；分寸感",rules:5,avatar:"魏",tone:"blue",pending:false},{name:"许新年",sub:"配角 · 人格灵魂",traits:"自尊与亲情并存；表达有锋芒",rules:4,avatar:"许",tone:"rose",pending:true}];if(k==="story")return [{name:"弱势开局与信息差",sub:"故事机制",traits:"压缩路径 → 信息改变选择 → 局部兑现",rules:6,avatar:"01",tone:"blue",pending:true},{name:"冲突升级与后续悬念",sub:"故事机制",traits:"抬升代价；转折条件；留下新问题",rules:4,avatar:"02",tone:"",pending:false}];return [{name:"对白与短段落节奏",sub:"文风画像",traits:"正式与口语反差；动作承接；短段落节拍",rules:8,avatar:"文",tone:"rose",pending:true}]}

function renderC(){const s=S(),confirmed=s.confirmed.has(s.kind+K().object);return `${pageHeader("composer","新建分析")}${bookLine("flow")}<section class="collection-stats" aria-label="成果概况"><div class="metric"><div class="metric-top">${icon("Layers")}可复用成果</div><b>6<span>角色 3 / 故事 2 / 文风 1</span></b></div><div class="metric"><div class="metric-top">${icon("Circle")}待确认</div><b>${confirmed?2:3}<span>保留为草稿</span></b></div><div class="metric"><div class="metric-top">${icon("Quote")}原文依据</div><b>28<span>可定位到章节</span></b></div></section>${s.composer?`<section class="inline-composer"><div class="close-composer"><h2>新建分析</h2>${ib("收起分析设置","composer","X")}</div>${kindTabs("analysis")}${composer()}</section>`:""}<section id="results">${kindTabs()}${resultTools()}<article><header class="document-heading"><div><div class="document-title"><span class="avatar ${s.kind==="style"?"rose":s.kind==="story"?"blue":""}">${s.kind==="characters"?"许":s.kind==="story"?"01":"文"}</span><h2>${K().object}</h2><span class="badge ${confirmed?"ready":"pending"}">${icon(confirmed?"CircleCheck":"Circle")}${confirmed?"已确认":"待确认"}</span></div><p class="doc-description">${K().brief}</p></div><div class="row"><select class="select" aria-label="结果版本"><option>v${s.versions+1} · 今天 10:32</option><option>v1 · 昨天 16:45</option></select>${ib("导出当前版本","download","Download")}</div></header><div class="document-meta"><span>${icon("BookOpen")}第1～20章</span><span>${icon("Quote")}${K().rules.length*2}条依据</span><span>${icon("ShieldCheck")||icon("CheckCheck")}自动核验通过</span><span>${icon("UserRound")}等待人工确认</span></div>${ruleList(3)}<footer class="doc-footer"><span class="caption">保留目标人物的身份、经历与能力边界</span><div class="row">${button("补充修订","revise","","","RefreshCw")}${button(confirmed?"已加入":"确认并加入",confirmed?"added":"confirm",K().object,confirmed?"soft":"primary","Check")}</div></footer>${s.revisionOpen?`<div class="revision-input"><textarea aria-label="补充修订要求" id="inline-revision" placeholder="补充本次需要调整的内容，例如：保留缺点，减少绝对化判断。"></textarea><div class="row" style="justify-content:flex-end;margin:10px 0">${button("生成修订版本","submitRevision","","primary","RefreshCw")}</div></div>`:""}</article>${resultItems().slice(1).map(item=>`<div class="other-result"><span class="avatar ${item.tone}">${item.avatar}</span><strong>${item.name}</strong><span class="result-sub">${item.rules}条规则 · ${item.pending?"待确认":"已加入"}</span><button class="text-link" data-action="other" data-value="${item.name}">查看${icon("ChevronRight")}</button></div>`).join("")}</section>`}
function render(options={}){
 const scroll=window.scrollY;$("#app").dataset.scheme=scheme;$("#workspace").className="workspace"+(scheme==="B"?" flow":scheme==="C"?" collection":"");
 $$(".design-tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.value===scheme)));
 $("#design-fit").textContent=descriptions[scheme][0];$("#design-description").textContent=descriptions[scheme][1];
 $("#workspace").innerHTML=scheme==="A"?renderA():scheme==="B"?renderB():renderC();
 const model=$('[aria-label="分析模型"]');if(model)model.selectedIndex=S().model;
 const version=$('[aria-label="结果版本"]');if(version)version.outerHTML=button(`v${S().versions+1} · 版本记录`,"history","","","History");
 applyResultFilters();
 if(options.top)window.scrollTo(0,0);else window.scrollTo(0,scroll);
}
function applyResultFilters(){
 const s=S(),items=resultItems();
 if(scheme==="A")$$(".result-row").forEach((row,i)=>{const item=items[i],confirmed=!item.pending||s.confirmed.has(s.kind+item.name);row.hidden=!`${item.name}${item.traits}`.includes(s.query)||(s.pendingOnly&&confirmed);const next=row.nextElementSibling;if(next?.classList.contains("result-expansion"))next.hidden=row.hidden});
 if(scheme==="C"){
  const article=$("#results article");if(article)article.hidden=!`${K().object}${K().brief}${K().rules.map(r=>r.title).join("")}`.includes(s.query)||(s.pendingOnly&&s.confirmed.has(s.kind+K().object));
  $$(".other-result").forEach((row,i)=>{const item=items[i+1];row.hidden=!`${item.name}${item.traits}`.includes(s.query)||(s.pendingOnly&&(!item.pending||s.confirmed.has(s.kind+item.name)))});
 }
 const filter=$('[data-action="filter"]');if(filter){filter.classList.toggle("soft",s.pendingOnly);filter.setAttribute("aria-pressed",String(s.pendingOnly))}
}
function modal(title,body,footer="",classes=""){
 const d=$("#modal");d.className=classes;$("#modal-content").innerHTML=`<header class="dialog-top"><h2 id="dialog-title">${title}</h2>${ib("关闭","close","X")}</header><div class="dialog-body">${body}</div>${footer?`<footer class="dialog-footer">${footer}</footer>`:""}`;if(!d.open)d.showModal();
}
function closeModal(){if($("#modal").open)$("#modal").close();modalState={};hideTooltip()}
function applyRange(from,to){
 if(!Number.isInteger(from)||!Number.isInteger(to)||from<1||to<from||to>currentBook().chapters){showToast(`请选择 1～${currentBook().chapters} 章内的有效范围`);return false}
 const s=S();s.start=from;s.end=to;s.ids=new Set(Array.from({length:to-from+1},(_,i)=>from+i));render();return true
}
const chapterTitles=["牢狱","妖风","推测","炼金","案卷","脱困","照面","暗流","旧事","来客","夜话","线索","问询","疑点","风起","归途","抉择","交锋","余波","新局"];
function chapterBody(){
 const search=modalState.search||"";const total=currentBook().chapters;const list=Array.from({length:total},(_,i)=>({n:i+1,title:chapterTitles[i%chapterTitles.length]})).filter(c=>`第${c.n}章 ${c.title}`.includes(search));
 return `<p class="notice">章节标题为界面示例；支持不连续勾选，选择不会启动分析。</p><div class="chapter-actions"><label class="searchbox">${icon("Search")}<input id="chapter-search" aria-label="搜索章节" placeholder="章节号或标题" value="${esc(search)}"></label>${button("选中搜索结果","selectSearch","","small")}${button("清空","clearChapters","","quiet small")}</div><div class="chapter-list">${list.map(c=>`<label class="chapter-item"><input type="checkbox" data-chapter="${c.n}" ${modalState.ids.has(c.n)?"checked":""}><span class="chapter-no">${String(c.n).padStart(3,"0")}</span><span>第${c.n}章 ${c.title}</span><small>3,250字</small></label>`).join("")}${list.length?"":'<div class="empty-line">没有匹配的章节</div>'}</div>`;
}
function openChapters(){modalState={type:"chapters",search:"",ids:new Set(S().ids)};chapterAnchor=null;refreshChapters()}
function refreshChapters(){modal("选择分析章节",chapterBody(),`<span class="caption" style="margin-right:auto" id="chapter-count">已选 ${modalState.ids.size} 章</span>${button("取消","close")}${button("应用选择","applyChapters","","primary")}`,"chapter-dialog")}
function openEvidence(index){
 const r=K().rules[index];modal("原文依据",`<p class="notice">固定展示样例，不随当前作品或分析范围重新生成。</p><div class="evidence-metadata"><span>《大奉打更人》</span><span>第${r.chapter}章</span><span>R${index+1}</span></div><h3>${r.title}</h3><blockquote class="evidence-quote">${esc(r.quote)}</blockquote><div class="evidence-note"><strong>原文观察</strong>${r.observation}</div><div class="evidence-note" style="margin-top:15px"><strong>迁移边界</strong>${r.boundary}</div>`,button("返回规则","close","","primary"));
}
function openBooks(){modalState={type:"books"};modal("切换作品",`<label class="searchbox" style="width:100%;margin-bottom:10px">${icon("Search")}<input id="book-search" aria-label="搜索作品" placeholder="搜索作品名称"></label><div id="book-options">${bookOptions("")}</div>`,button("导入作品","import","","","Upload"))}
function bookOptions(search){return books.map((b,i)=>({b,i})).filter(({b})=>b.title.includes(search)).map(({b,i})=>`<button class="modal-book-option" data-action="pickBook" data-value="${i}"><span class="book-glyph">${icon("BookOpen")}</span><span><b>${esc(b.title)}</b><span class="book-meta">${b.chapters}章 · ${esc(b.author)}</span></span>${S().book===i?`<span class="check-indicator">${icon("Check")}</span>`:""}</button>`).join("")}
function openImport(){modalState={type:"import",files:[]};drawImport()}
function drawImport(){modal("导入作品",`<p class="notice">设计预览仅展示文件名，不读取正文、不写入软件作品库。</p><div class="upload-band" style="padding:24px 18px">${icon("FileText")}<h3>TXT 小说文件</h3>${button("选择文件","pickFiles","","","Plus")}<input type="file" id="files" accept=".txt" multiple hidden></div><div id="file-list">${(modalState.files||[]).map((f,i)=>`<div class="file-item">${icon("FileText")}<span class="file-info"><b>${esc(f.name)}</b><small>${(f.size/1024).toFixed(1)} KB</small></span>${ib("移除文件","removeFile","X",i)}</div>`).join("")}</div>`,`${button("取消","close")}${button("导入并分章","submitImport","","primary","Upload")}`)}
function openTargets(){modalState={type:"targets",targets:new Set(S().targets)};modal("选择目标角色",`<div>${["许七安","魏渊","许新年","许玲月"].map((n,i)=>`<label class="chapter-item" style="grid-template-columns:20px 1fr auto"><input type="checkbox" data-modal-target="${n}" ${S().targets.has(n)?"checked":""}><span>${n}</span><span class="caption">${i===0?"主角":"配角"}</span></label>`).join("")}</div>`,`${button("取消","close")}${button("确认选择","applyTargets","","primary")}`)}
function confirm(name){
 modalState={type:"confirm",name};const destination=S().kind==="characters"?"自定义灵魂库":S().kind==="story"?"故事框架库":"文风库";
 modal("确认加入",`<div class="confirm-block"><span class="confirm-symbol">${icon("Bookmark")}</span><div><h3>${esc(name)}</h3><p class="caption">${destination} · 新版本</p></div></div><div class="confirm-notice">只保存这份已确认的规则。不会自动绑定小说人物，不会覆盖现有人物小传，也不会自动启用文风。</div><p class="notice" style="margin:14px 0 0">此 HTML 中的确认仅改变预览状态，不会执行真实入库。</p>`,`${button("继续查看","close")}${button("确认加入","submitConfirm","","primary","Check")}`);
}
function startGeneration(revision=false){
 const s=S();if(s.job==="running"){showToast("已有一项模拟分析正在运行");return}
 if(!s.ids.size){showToast("请先选择章节");return}
 if(s.kind==="characters"&&!s.targets.size){showToast("请至少选择一个角色");return}
 closeModal();s.job="running";if(scheme==="B")s.step=3;render();showToast(revision?"正在演示修订流程，不调用 AI":"正在演示分析流程，不调用 AI");const own=scheme;
 clearTimeout(timer);timer=setTimeout(()=>{const st=states[own];if(st.job!=="running")return;st.job="done";st.versions++;st.expanded=0;st.composer=false;st.revisionOpen=false;st.confirmed.delete(st.kind+kinds[st.kind].object);if(own===scheme){render();showToast("模拟分析完成 · 示例规则已展示，等待确认")}},1800);
}
function download(){
 const content=`# ${K().object} · ${K().label}\n\n> 界面设计示例，不是真实分析产物。\n\n${K().rules.map((r,i)=>`## R${i+1} ${r.title}\n\n适用：${r.condition}\n\n${r.action}\n\n边界：${r.boundary}`).join("\n\n")}`;
 const url=URL.createObjectURL(new Blob([content],{type:"text/markdown;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download=`设计示例-${K().object}.md`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast("已导出带有“设计示例”标记的文档")
}
function openRevision(){if(scheme==="C"){S().revisionOpen=!S().revisionOpen;render();$("#inline-revision")?.focus();return}modal("补充修订要求",`<p class="notice">修订保留旧版本，不直接覆盖已确认成果。</p><div class="revision-input"><textarea id="revision-text" aria-label="补充修订要求" placeholder="例如：减少绝对化判断，明确哪些例外仍缺乏证据。"></textarea></div>`,`${button("取消","close")}${button("生成修订版本","submitRevision","","primary","RefreshCw")}`)}
document.addEventListener("click",event=>{
 const el=event.target.closest("[data-action]");if(!el)return;hideTooltip();const action=el.dataset.action,value=el.dataset.value;const s=S();
 if(action==="scheme"){closeModal();scheme=value;location.hash=scheme;render({top:true});return}
 if(action==="kind"){s.kind=value;s.query="";s.expanded=null;render();return}
 if(action==="close"){closeModal();return}
 if(action==="applyRange"){applyRange(Number($('[data-field="start"]').value),Number($('[data-field="end"]').value));return}
 if(action==="preset"){const max=currentBook().chapters;const end=Math.max(...s.ids,0);applyRange(value==="next"?Math.min(end+1,max):1,value==="all"?max:value==="next"?Math.min(end+20,max):Math.min(20,max));return}
 if(action==="chapters"){openChapters();return}
 if(action==="selectSearch"){const q=modalState.search;for(let n=1;n<=currentBook().chapters;n++)if(`第${n}章 ${chapterTitles[(n-1)%chapterTitles.length]}`.includes(q))modalState.ids.add(n);refreshChapters();return}
 if(action==="clearChapters"){modalState.ids.clear();refreshChapters();return}
 if(action==="applyChapters"){s.ids=new Set(modalState.ids);if(s.ids.size){s.start=Math.min(...s.ids);s.end=Math.max(...s.ids)}closeModal();render();return}
 if(action==="books"){openBooks();return}
 if(action==="pickBook"){s.book=Number(value);s.ids=new Set(Array.from({length:20},(_,i)=>i+1));s.start=1;s.end=20;closeModal();render();showToast("已切换作品；成果为布局示例数据");return}
 if(action==="import"){openImport();return}
 if(action==="pickFiles"){$("#files").click();return}
 if(action==="removeFile"){modalState.files.splice(Number(value),1);drawImport();return}
 if(action==="submitImport"){if(!modalState.files.length){showToast("请先选择 TXT 文件");return}const count=modalState.files.length;closeModal();if(scheme==="B")s.step=2;render();showToast(`已演示 ${count} 个文件的导入确认；未读取或保存正文`);return}
 if(action==="targets"){openTargets();return}
 if(action==="applyTargets"){s.targets=new Set(modalState.targets);closeModal();render();return}
 if(action==="removeTarget"){s.targets.delete(value);render();return}
 if(action==="expand"){s.expanded=s.expanded===Number(value)?null:Number(value);render();return}
 if(action==="evidence"){openEvidence(Number(value));return}
 if(action==="confirm"){confirm(value||K().object);return}
 if(action==="submitConfirm"){s.confirmed.add(s.kind+modalState.name);closeModal();render();showToast("已确认 · 仅更新此预览的状态");return}
 if(action==="added"){showToast("此项示例成果已加入");return}
 if(action==="generate"){startGeneration();return}
 if(action==="pause"){clearTimeout(timer);if(s.job==="running"){s.job="paused";render();showToast("模拟分析已暂停")}else{s.job="done";startGeneration()}return}
 if(action==="cancel"){clearTimeout(timer);s.job="done";render();showToast("已取消模拟任务，现有成果保留");return}
 if(action==="results"){if(scheme==="B"){s.step=4;render()}else $("#results")?.scrollIntoView({behavior:"smooth",block:"start"});return}
 if(action==="step"){s.step=Number(value);render();return}
 if(action==="composer"){s.composer=!s.composer;render();if(s.composer)$(".inline-composer")?.scrollIntoView({behavior:"smooth",block:"start"});return}
 if(action==="revise"){openRevision();return}
 if(action==="submitRevision"){const input=$("#revision-text")||$("#inline-revision");if(!input?.value.trim()){showToast("请填写修订要求");return}s.requirements[s.kind]+="\n补充要求："+input.value.trim();startGeneration(true);return}
 if(action==="download"){download();return}
 if(action==="filter"){modal("筛选成果",`<label class="target-option"><input type="checkbox" id="filter-pending" ${s.pendingOnly?"checked":""}>只看待确认成果</label>`,button("应用","applyFilter","","primary"));return}
 if(action==="applyFilter"){s.pendingOnly=$("#filter-pending").checked;closeModal();render();showToast(s.pendingOnly?"已筛选待确认成果":"已显示全部成果");return}
 if(action==="history"){modal("分析与版本记录",`<div class="ledger-line">${icon("CircleCheck")}许七安 · 处事与判断<span class="caption">今天 10:32</span></div><div class="ledger-line">${icon("CircleCheck")}弱势开局与信息差<span class="caption">昨天 16:45</span></div><div class="ledger-line">${icon("CircleCheck")}对白与段落节奏<span class="caption">10月3日</span></div><p class="notice" style="margin-top:15px">以上为界面示例记录。</p>`,button("关闭","close"));return}
 if(action==="bookMenu"){modal("作品管理",`${bookLine("flow")}<div class="row">${button("切换作品","books","","","BookOpen")}${button("导入新作品","import","","","Upload")}${button("任务与版本","history","","","History")}</div>`,button("关闭","close"));return}
 if(action==="other"){modal(`${esc(value)} · 人格规则`, `<p class="notice">预览样例 · 第1～20章</p><h3>${value==="魏渊"?"克制表达与长线判断":"自尊与亲情并存"}</h3><p style="margin-top:12px;font-size:13px">将表达方式、判断顺序和例外边界分别保存；不继承原作人物的身份、知识或亲属关系。</p>`,`${button("返回","close")}${button("确认加入","confirm",value,"primary","Check")}`);return}
});
document.addEventListener("input",event=>{
 const el=event.target,s=S();
 if(el.dataset.field==="requirements"){s.requirements[s.kind]=el.value;return}
 if(el.dataset.field==="query"){s.query=el.value;applyResultFilters();return}
 if(el.id==="chapter-search"){const position=el.selectionStart;modalState.search=el.value;refreshChapters();const input=$("#chapter-search");input.focus();input.setSelectionRange(position,position);return}
 if(el.id==="book-search"){$("#book-options").innerHTML=bookOptions(el.value)}
});
document.addEventListener("change",event=>{
 const el=event.target;
 if(el.getAttribute("aria-label")==="分析模型")S().model=el.selectedIndex;
 if(el.dataset.target){if(el.checked)S().targets.add(el.dataset.target);else S().targets.delete(el.dataset.target)}
 if(el.dataset.modalTarget){if(el.checked)modalState.targets.add(el.dataset.modalTarget);else modalState.targets.delete(el.dataset.modalTarget)}
 if(el.id==="files"){
  const files=[...el.files].filter(f=>f.name.toLowerCase().endsWith(".txt"));modalState.files.push(...files);drawImport();
  if(!files.length)showToast("请选择 TXT 文件");
 }
});
document.addEventListener("click",event=>{
 const el=event.target;if(!el.matches("input[data-chapter]"))return;const n=Number(el.dataset.chapter);
 if(event.shiftKey&&chapterAnchor!==null){for(let i=Math.min(n,chapterAnchor);i<=Math.max(n,chapterAnchor);i++){if(el.checked)modalState.ids.add(i);else modalState.ids.delete(i)}}
 else if(el.checked)modalState.ids.add(n);else modalState.ids.delete(n);
 chapterAnchor=n;const scroll=$(".chapter-list").scrollTop;refreshChapters();$(".chapter-list").scrollTop=scroll;
});
$("#modal").addEventListener("click",event=>{if(event.target!==$("#modal"))return;const r=event.target.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal()});
$("#modal").addEventListener("cancel",()=>{modalState={};hideTooltip()});
function hideTooltip(){$("#tooltip").hidden=true;tooltipTarget=null}
document.addEventListener("pointerover",event=>{const el=event.target.closest("[data-tip]");if(!el)return;tooltipTarget=el;const tooltip=$("#tooltip");tooltip.textContent=el.dataset.tip;tooltip.hidden=false;const r=el.getBoundingClientRect(),t=tooltip.getBoundingClientRect();tooltip.style.left=Math.max(10,Math.min(innerWidth-t.width-10,r.left+r.width/2-t.width/2))+"px";tooltip.style.top=Math.min(innerHeight-t.height-10,r.bottom+7)+"px"});
document.addEventListener("pointerout",event=>{if(tooltipTarget&&!tooltipTarget.contains(event.relatedTarget))hideTooltip()});
window.addEventListener("scroll",hideTooltip,{passive:true});
window.addEventListener("hashchange",()=>{const next=location.hash.slice(1);if(/^[ABC]$/.test(next)&&next!==scheme){closeModal();scheme=next;render({top:true})}});
$$("[data-icon]").forEach(el=>el.innerHTML=ICONS[el.dataset.icon]||"");
render();
</script>
</body>
</html>
