<body data-design="A">
<header class="proposal-bar">
  <div class="proposal-brand">拆书库 · 第二轮<small>交互设计稿</small></div>
  <nav class="proposal-tabs" role="tablist" aria-label="设计方案">
    <button data-action="design" data-value="A" role="tab" aria-selected="true"><b>01</b>紧凑工作区</button>
    <button data-action="design" data-value="B" role="tab" aria-selected="false"><b>02</b>需求编排</button>
    <button data-action="design" data-value="C" role="tab" aria-selected="false"><b>03</b>规则编辑器</button>
  </nav>
</header>
<div class="proposal-context"><span id="proposal-note"></span><span>示例数据 · 无模型调用 · 不修改软件</span></div>
<div id="app"></div>
<dialog id="modal" aria-labelledby="modal-title"></dialog>

<script>
/* ICON_DATA */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const escape=value=>String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon=name=>`<span class="icon" aria-hidden="true">${ICONS[name]||""}</span>`;
const btn=(text,action,value="",kind="",symbol="")=>`<button class="btn ${kind}" data-action="${action}" data-value="${escape(value)}">${symbol?icon(symbol):""}${text}</button>`;
const tool=(title,action,symbol,value="",extra="")=>`<button class="btn icon-button ${extra}" title="${title}" aria-label="${title}" data-action="${action}" data-value="${escape(value)}">${icon(symbol)}</button>`;
const textBtn=(text,action,value="",symbol="")=>`<button class="text-button" data-action="${action}" data-value="${escape(value)}">${symbol?icon(symbol):""}${text}</button>`;
const kinds={
  character:{label:"角色灵魂",short:"角色",icon:"UserRound",count:3,requirement:"提炼许七安面对压力时的判断、处事方式和性格矛盾。保留缺点，不继承警察身份、穿越经历、知识和战力。",summary:"处事方式、判断倾向、性格边界",title:"许七安 · 处事与判断",tags:["先核实，再判断","嘴硬与关心并存","底线与风险意识"],rules:[
    {title:"信息不足时，先核验再下结论",trigger:"线索互相矛盾，而且仍有进一步核实的条件。",action:"区分已知事实与自己的猜测，寻找能验证关键判断的材料，再决定行动。允许怀疑，但不凭“聪明”跳过验证。",limit:"仅迁移判断顺序；不附带侦查知识、现代知识或原作职业。",source:"第5章 · 行为样例",observation:"面对异常现象，先提出一种解释，再寻找验证路径。此处为情节概述，不是原文引文。"},
    {title:"关心落在行动，表达保留锋芒",trigger:"亲近的人需要帮助，双方又不愿直接示弱。",action:"先解决对方的实际困难，表达上保留调侃与回避。外在的嘴硬与实际付出可以同时存在，而不是只有体贴的一面。",limit:"这是有条件的行为倾向，不能推断为所有亲密关系中的固定反应。",source:"第48章 · 关系样例",observation:"借第三方传达心意，嘴上不肯认输，但仍有实际付出。此处为情节概述，不是原文引文。"},
    {title:"底线受触动时，愿意承担代价",trigger:"明显的伤害正在发生，继续回避会纵容伤害。",action:"把制止伤害列入行动优先级，并承担自己选择带来的后果。行动方式仍受目标人物当下能力、资源与处境限制。",limit:"不是每遇冲突都立即硬碰；不移植原作的胜负结果或战力。",source:"第102章 · 决策样例",observation:"保护弱者与自我保全形成冲突，人物明确作出有代价的选择。此处为情节概述，不是原文引文。"}
  ]},
  story:{label:"故事框架",short:"故事",icon:"GitBranch",count:2,requirement:"分析困境如何建立、信息如何改变选择，以及转折怎样兑现。提炼可迁移的推进机制，不复述原作剧情。",summary:"目标阻力、信息投放、转折兑现",title:"困境开局 · 信息推动转折",tags:["目标受限","信息改变选择","局部兑现"],rules:[
    {title:"先收紧出路，再建立阶段目标",trigger:"角色面临清晰的困境和时间压力。",action:"让主要阻力先变得可见，再逐步收窄可行路径。阶段目标必须具体到读者能够判断是否完成。",limit:"限制来自故事内条件，不能为制造紧张感临时添加规则。",source:"开局章节 · 结构样例",observation:"自救目标连接后续线索与选择；这是机制概述，不是原文引文。"},
    {title:"新信息必须改变行动选择",trigger:"获得的新材料足以修正旧判断。",action:"信息揭示后，让人物重估路线、改变调查方向或调整策略，而不只是多知道一个背景事实。",limit:"不能在转折时临时补出此前毫无铺垫的决定性证据。",source:"调查章节 · 信息样例",observation:"对异常现象的新解释成为下一步调查的入口。"},
    {title:"阶段兑现之后，留下真实的新问题",trigger:"当前目标取得局部进展。",action:"先兑现本轮行动的回报，再由已经发生的变化引出后续问题。新的悬念应与此前选择存在因果联系。",limit:"没有状态变化的章节，不强行补足转折或事件。",source:"章节衔接 · 设计样例",observation:"此项展示结构规则的版式，不代表对原作全书的分析结论。"}
  ]},
  style:{label:"文风规则",short:"文风",icon:"Feather",count:1,requirement:"关注对白反差、段落节奏与视角转换。给出适用条件及局限，不把人物价值观当作文风，也不强制每段都套模板。",summary:"表达方式、对白、段落与节奏",title:"对白反差 · 短段落节奏",tags:["语体反差","动作承接","节奏停顿"],rules:[
    {title:"用语体反差，而非复制人物身份",trigger:"人物之间存在立场差异或表达习惯差异。",action:"让一方的正式表达与另一方的短促口语形成反差。具体措辞取自目标人物自身的背景与当前环境。",limit:"不让所有角色都现代化或玩梗；不将原型价值观写成文风要求。",source:"对白片段 · 表达样例",observation:"严肃处境与口语化内心表达构成对照。"},
    {title:"态度变化时，让动作承接对白",trigger:"一个对白回合中出现犹豫、停顿或态度转变。",action:"用一个与场景有关的短动作承接对白，让下一句话与上一句话的力度发生变化，减少直接解释情绪。",limit:"不是每句对白都插入动作；没有变化时保留直接交流。",source:"对白片段 · 节拍样例",observation:"动作与短句之间的停顿可用于承载语气变化。"},
    {title:"段落长短服从信息变化",trigger:"叙述从背景说明切换到即时反应或新的信息点。",action:"在注意力真正转向时换段；即时反应可以短，必要的因果交代应完整，不按固定字数机械拆段。",limit:"统计值只是观察，不是所有章节都必须遵守的字数配额。",source:"段落结构 · 展示样例",observation:"此项仅演示文风分析的展示方式，没有执行真实统计。"}
  ]}
};
const books=[{title:"大奉打更人",author:"卖报小郎君",chapters:923},{title:"庆余年",author:"猫腻",chapters:746},{title:"诡秘之主",author:"爱潜水的乌贼",chapters:1394}];
const notes={
  A:"方向 01 · 紧凑工作区：顶部集中设置，成果用可读摘要呈现。全部操作留在同一页。",
  B:"方向 02 · 需求编排：按提炼目标组织输入，三类需求独立保存，可同时生成。",
  C:"方向 03 · 规则编辑器：把 Skill 当作一份可核对、可修订的规则稿。"
};
function fresh(){return {book:0,kind:"character",selected:new Set(["character"]),demands:Object.fromEntries(Object.entries(kinds).map(([key,k])=>[key,k.requirement])),chapters:new Set(Array.from({length:20},(_,i)=>i+1)),from:1,to:20,chapterOpen:false,chapterSearch:"",targets:new Set(["许七安"]),openRequests:new Set(["character"]),query:"",pending:false,view:"grid",expanded:new Set(),evidence:new Set(),confirmed:new Set(),version:2,model:"默认模型 · DeepSeek",job:"idle",composer:false,revision:false}};
const states={A:fresh(),B:fresh(),C:fresh()};
let design=/^[ABC]$/.test(location.hash.slice(1))?location.hash.slice(1):"A",toastTimer,modalState={},anchor=null;
const timers={};
const S=()=>states[design],K=()=>kinds[S().kind],book=()=>books[S().book];
function toast(message){clearTimeout(toastTimer);$("#toast").textContent=message;$("#toast").hidden=false;toastTimer=setTimeout(()=>$("#toast").hidden=true,3400)}
function header(){return `<header class="app-header"><div class="app-id"><img src="__LOGO__" alt="青幕AI"><h1>拆书库</h1></div><span class="header-divider"></span><button class="book-switch" data-action="books" aria-label="切换作品">${icon("BookOpen")}<b>${book().title}</b><span class="chevron">${icon("ChevronDown")}</span></button><span class="book-info">${book().chapters} 章 <span style="padding:0 7px">·</span> 已导入</span><div class="header-actions">${tool("任务与版本","history","History","","optional")}${design==="C"?btn("新建分析","composer","","","Plus"):btn("导入作品","import","","","Upload")}${tool("作品管理","manage","MoreHorizontal","","optional")}</div></header>`}
function rangeLabel(){const s=S(),ids=[...s.chapters].sort((a,b)=>a-b);if(!ids.length)return "未选择章节";const continuous=ids[ids.length-1]-ids[0]+1===ids.length;return continuous?`第${ids[0]}-${ids[ids.length-1]}章`:`${ids.length}章 · 不连续选择`}
function rangeBar(){const s=S();return `<div class="rangebar"><span class="label">分析范围</span><div class="range-fields"><input class="input" type="number" min="1" max="${book().chapters}" value="${s.from}" aria-label="起始章节"><span class="caption">至</span><input class="input" type="number" min="1" max="${book().chapters}" value="${s.to}" aria-label="结束章节">${btn("应用","range","","quiet tiny")}</div><div class="range-actions">${btn("前20章","preset","first","quiet tiny")}${btn("后续20章","preset","next","quiet tiny")}${btn("全书","preset","all","quiet tiny")}${btn(s.chapterOpen?"收起清单":"挑选章节","chapters","","tiny","ListFilter")}</div><div class="selection-summary"><b>${s.chapters.size}章</b><span>·</span><span>${Math.ceil(s.chapters.size/10)}个区块</span></div></div>${s.chapterOpen?chapterPicker():""}`}
function chapterPicker(){return `<div class="range-detail"><div class="range-detail-head"><label class="search">${icon("Search")}<input aria-label="搜索章节" data-input="chapters" placeholder="章节号 / 标题" value="${escape(S().chapterSearch)}"></label>${btn("选中搜索结果","selectMatches","","tiny")}${btn("清空","clearChapters","","quiet tiny")}<span class="caption push" id="chapter-count">已选 ${S().chapters.size} 章</span></div><div class="chapter-grid" id="chapter-grid">${chapterOptions()}</div><div class="range-detail-foot">章节标题为示例</div></div>`}
const chapterNames=["牢狱","妖风","推测","炼金","案卷","脱困","夜话","线索","交锋","新局"];
function matches(){return Array.from({length:book().chapters},(_,i)=>i+1).filter(n=>`第${n}章 ${chapterNames[(n-1)%10]}`.includes(S().chapterSearch))}
function chapterOptions(){const s=S();return matches().map(n=>`<label class="chapter-option"><input type="checkbox" data-chapter="${n}" ${s.chapters.has(n)?"checked":""}><span>第${n}章 ${chapterNames[(n-1)%10]}</span></label>`).join("")||'<p class="empty">没有匹配的章节</p>'}
function targets(){return `<div class="target-row"><span class="caption">目标角色</span>${["许七安","魏渊","许新年"].map((n,i)=>`<label class="person-pick"><input type="checkbox" data-target="${n}" ${S().targets.has(n)?"checked":""}>${n}${i===0?"<em>主角</em>":""}</label>`).join("")}</div>`}
function types(){return `<div class="type-picks">${Object.entries(kinds).map(([key,k])=>`<div class="type-pick ${S().kind===key?"active":""}"><input type="checkbox" data-type="${key}" aria-label="分析${k.label}" ${S().selected.has(key)?"checked":""}><button class="type-focus" data-action="focusDemand" data-value="${key}">${icon(k.icon)}${k.label}</button></div>`).join("")}</div>`}
function model(){return `<select class="select" aria-label="分析模型" data-input="model">${["默认模型 · DeepSeek","Gemini · 快速分析"].map(v=>`<option${S().model===v?" selected":""}>${v}</option>`).join("")}</select>`}
function demand(kind=S().kind,variant="default"){const k=kinds[kind];return `<div class="demand-box"><div class="demand-top"><b>${k.label}需求</b><span class="caption">独立保存</span></div><textarea rows="3" aria-label="${k.label}需求" data-demand="${kind}" placeholder="填写本次希望提炼的内容">${escape(S().demands[kind])}</textarea><div class="demand-bottom">${variant==="request"?`<span class="hint-dot">${S().demands[kind].length}字 · 自定义需求</span>${textBtn("恢复默认目标","resetDemand",kind,"Undo2")}`:`${model()}<span class="hint-dot">约 ${(S().chapters.size*3250).toLocaleString()} 字正文</span>${btn("开始分析"+(S().selected.size>1?` · ${S().selected.size}项`:""),"generate","","primary","Play")}`}</div></div>`}
function analysis(){return `<section class="analysis-surface"><div class="section-heading"><h2><span class="step-number">01</span>设置分析</h2><span class="caption">TXT · ${book().chapters}章</span></div>${rangeBar()}${types()}${S().kind==="character"?targets():""}${demand()}</section>`}
function progress(){const s=S();if(s.job==="running"||s.job==="paused")return `<div class="progress-line">${icon(s.job==="running"?"RefreshCw":"Pause")}<b>${s.job==="running"?"正在分析":"已暂停"}</b><span>${rangeLabel()}</span><span class="progress-track"><i${s.job==="paused"?' style="animation-play-state:paused"':""}></i></span><span class="caption">模拟流程</span><div class="row push">${tool(s.job==="running"?"暂停":"继续","pause",s.job==="running"?"Pause":"Play")}${tool("取消任务","cancel","X")}</div></div>`;return `<div class="progress-line">${icon("CircleCheck")}<span>${s.job==="done"?"本次模拟分析完成":"最近分析已完成"}</span><span class="caption">许七安 · 3条人格规则 · 待确认</span>${textBtn("查看任务","history","","ArrowUpRight")}</div>`}
function resultTabs(){return `<nav class="result-tabs" aria-label="成果类型">${Object.entries(kinds).map(([key,k])=>`<button class="${S().kind===key?"active":""}" data-action="kind" data-value="${key}">${k.short} Skill <small>${k.count}</small></button>`).join("")}</nav>`}
function items(){const k=K();if(S().kind==="character")return [{id:"xqa",name:"许七安",subtitle:"主角 · 处事与判断",avatar:"许",tone:"",description:"先核实再判断，关心藏在实际行动里；有底线，也有自己的顾虑。",tags:k.tags,ruleCount:3,pending:true},{id:"wy",name:"魏渊",subtitle:"配角 · 克制与谋划",avatar:"魏",tone:"blue",description:"克制情绪表达，权衡长线影响；亲近与分寸之间保留张力。",tags:["克制表达","长线判断","有分寸的关心"],ruleCount:2,pending:false},{id:"xnn",name:"许新年",subtitle:"配角 · 自尊与亲情",avatar:"许",tone:"rose",description:"语言有锋芒，自尊不轻易放下；涉及家人时，行动又有另一面。",tags:["自尊","表达锋利","亲情牵引"],ruleCount:2,pending:true}];return [{id:S().kind,name:k.title,subtitle:k.label,avatar:S().kind==="story"?"构":"文",tone:S().kind==="story"?"blue":"rose",description:k.summary,tags:k.tags,ruleCount:k.rules.length,pending:true},...(S().kind==="story"?[{id:"story-2",name:"冲突升级与局部兑现",subtitle:"故事机制",avatar:"构",tone:"",description:"让阻力改变策略，让阶段回报带来下一轮真实问题。",tags:["升级代价","因果衔接","局部兑现"],ruleCount:2,pending:false}]:[])]}
function cards(){const s=S(),list=items().filter(item=>(`${item.name}${item.tags.join("")}`.includes(s.query))&&(!s.pending||item.pending&&!s.confirmed.has(item.id)));return list.map(item=>{const confirmed=!item.pending||s.confirmed.has(item.id);return `<article class="skill-card"><div class="card-main"><div class="card-heading"><span class="avatar ${item.tone}">${item.avatar}</span><div><h3>${item.name}</h3><small>${item.subtitle}</small></div><span class="status ${confirmed?"ready":"pending"}">${confirmed?"已入库":"待确认"}</span></div><p class="card-description">${item.description}</p><div class="trait-tags">${item.tags.map(t=>`<span>${t}</span>`).join("")}</div><div class="card-meta"><span>${item.ruleCount}条规则</span><span>v${s.version}</span><span>样例来源</span></div></div><footer class="card-footer">${textBtn(s.expanded.has(item.id)?"收起规则":"查看规则","expand",item.id,"FileText")}${tool("修订需求","revise","PencilLine",item.id)}${btn(confirmed?"已加入":"确认加入",confirmed?"added":"confirm",item.id,confirmed?"soft tiny":"tiny")}</footer>${s.expanded.has(item.id)?`<div class="card-detail"><strong>适用条件</strong><p>${item.id==="xqa"?kinds.character.rules[0].trigger:"目标人物存在相应的处境或关系张力时。"}</p><strong>行为规则</strong><p>${item.id==="xqa"?kinds.character.rules[0].action:item.description}</p>${textBtn("查看完整规则与依据","review",item.id,"ArrowUpRight")}</div>`:""}</article>`}).join("")||'<div class="empty">没有符合条件的成果</div>'}
function results(){return `<section class="results-area"><div class="results-head">${resultTabs()}<div class="row"><label class="search">${icon("Search")}<input data-input="results" aria-label="搜索成果" placeholder="搜索角色 / 规则" value="${escape(S().query)}"></label><div class="segmented" aria-label="展示方式"><button aria-label="卡片视图" data-action="view" data-value="grid" class="${S().view==="grid"?"active":""}">${icon("LayoutGrid")}</button><button aria-label="列表视图" data-action="view" data-value="list" class="${S().view==="list"?"active":""}">${icon("List")}</button></div></div></div><div class="result-filter"><span class="caption">${K().count}份成果 · 未确认内容不会加入使用库</span><label><input type="checkbox" data-input="pending" ${S().pending?"checked":""}>仅待确认</label></div><div class="skill-grid ${S().view}" id="skill-grid">${cards()}</div></section>`}
function renderA(){return `<main class="workspace">${analysis()}${progress()}${results()}</main>`}
function renderB(){const s=S();return `<main class="workspace request-workspace"><section class="request-intro"><div><h2>这次想从作品中提炼什么？</h2><span class="caption">${book().title} / 新建分析</span></div><span class="pill">${icon("FileText")}需求草稿</span></section><section class="request-source">${rangeBar()}</section><section class="request-stack">${Object.entries(kinds).map(([key,k])=>`<article class="request-item"><header class="request-title"><input type="checkbox" data-type="${key}" aria-label="生成${k.label}" ${s.selected.has(key)?"checked":""}>${icon(k.icon)}<strong>${k.label}<span class="brief">${k.summary}</span></strong><button class="btn icon-button quiet ${s.openRequests.has(key)?"open":""}" aria-label="${s.openRequests.has(key)?"收起":"展开"}${k.label}需求" aria-expanded="${s.openRequests.has(key)}" data-action="request" data-value="${key}">${icon("ChevronDown")}</button></header>${s.openRequests.has(key)?`<div class="request-body">${key==="character"?targets():""}${demand(key,"request")}</div>`:""}</article>`).join("")}</section><footer class="request-footer"><div class="row">${model()}<span class="caption">${s.selected.size}类目标 · ${s.chapters.size}章 · ${Math.ceil(s.chapters.size/10)}个区块</span></div>${btn("生成所选 Skill","generate","","primary","Sparkles")}</footer>${s.job!=="idle"?progress():""}<section class="request-preview"><header class="request-preview-head">${icon("FileText")}<h3>许七安 · 处事与判断</h3><span class="caption">最近成果 / v${s.version}</span><span class="status ${s.confirmed.has("xqa")?"ready":"pending"}">${s.confirmed.has("xqa")?"已入库":"待确认"}</span></header><div class="preview-rules">${kinds.character.rules.map((r,i)=>`<div class="preview-rule"><div class="caption">R0${i+1}</div><h4>${["判断顺序","表达张力","行动边界"][i]}</h4><p>${r.action}</p></div>`).join("")}</div><footer class="preview-actions">${textBtn("完整规则与原文依据","review","xqa","Quote")}<div class="row">${btn("补充修订","revise","xqa","","PencilLine")}${btn(s.confirmed.has("xqa")?"已加入":"确认加入",s.confirmed.has("xqa")?"added":"confirm","xqa",s.confirmed.has("xqa")?"soft":"","Check")}</div></footer></section></main>`}
function editorRule(r,i){return `<section class="rule-section" id="rule-${i}"><header class="rule-title"><span class="rule-number">0${i+1}</span><h3>${r.title}</h3>${textBtn(S().evidence.has(i)?"收起依据":"查看依据","evidence",i,"Quote")}</header><dl class="rule-fields"><dt>触发</dt><dd>${r.trigger}</dd><dt>倾向</dt><dd>${r.action}</dd><dt>边界</dt><dd>${r.limit}</dd></dl>${S().evidence.has(i)?`<div class="inline-evidence"><div class="row"><b>${r.source}</b><span>·</span><span>情节概述 / 非逐字引文</span></div>${r.observation}</div>`:""}</section>`}
function renderC(){const s=S(),id=s.kind==="character"?"xqa":s.kind,confirmed=s.confirmed.has(id);return `<main class="workspace editor-workspace"><nav class="editor-tabs" aria-label="规则类别">${Object.entries(kinds).map(([key,k])=>`<button class="${s.kind===key?"active":""}" data-action="kind" data-value="${key}">${icon(k.icon)}${k.label}</button>`).join("")}<span class="caption">6份成果</span></nav>${s.composer?`<section class="editor-composer">${analysis()}</section>`:""}${s.job==="running"||s.job==="paused"?`<div class="editor-toolbar" style="display:block">${progress()}</div>`:""}<div class="editor-toolbar"><div class="editor-path">${icon("Library")}<span>分析成果</span>${icon("ChevronRight")}<b>${s.kind==="character"?"许七安":K().label}</b></div><div class="row">${btn(`v${s.version}`,"history","","quiet tiny","History")}${tool("导出规则","download","Download")}${btn(confirmed?"已入库":"确认加入",confirmed?"added":"confirm",id,confirmed?"soft":"primary","Check")}</div></div><article class="editor-document"><header><div class="doc-eyebrow">${icon(K().icon)}${K().label} / 可迁移 Skill</div><div class="document-title"><h2>${K().title}</h2>${tool("补充修订","revise","PencilLine",id)}</div><p class="document-description">${s.kind==="character"?"保留这个人物如何判断、如何对待他人，以及在压力下如何选择；不把原作身份带入新的故事。":K().requirement}</p><div class="doc-tags">${K().tags.map(t=>`<span>${t}</span>`).join("")}<span>${confirmed?"已人工确认":"待人工确认"}</span></div><div class="doc-notice">${s.kind==="character"?"迁移边界：保留目标人物自身的职业、时代、经历与能力。以下规则是有条件的倾向，不是无条件的行为指令。":"适用边界：只迁移有依据的结构或表达规则，不搬运原作剧情，不强行要求每章满足所有规则。"}</div></header><nav class="doc-outline" aria-label="规则目录"><span>规则目录</span>${K().rules.map((r,i)=>`<a href="#rule-${i}">${String(i+1).padStart(2,"0")} ${s.kind==="character"?["判断顺序","表达张力","行动边界"][i]:r.title.slice(0,8)}</a>`).join("")}</nav>${K().rules.map(editorRule).join("")}<footer class="doc-bottom"><span class="caption">来源样例 · 原文观察与创作要求分别保留</span><div class="row">${btn("补充修订","revise",id,"","PencilLine")}${btn("导出 Skill","download","","","Download")}</div></footer>${s.revision?`<section class="editor-revision"><div class="section-heading"><h2>补充修订要求</h2>${tool("收起修订","revise","X",id)}</div><textarea class="modal-textarea" id="inline-revision" aria-label="修订要求" placeholder="例如：保留人物的犹豫与缺点，减少绝对化判断。"></textarea><div class="row" style="justify-content:flex-end;margin-top:12px">${btn("生成新版本","submitRevision","","primary","RefreshCw")}</div></section>`:""}</article></main>`}
function render(){const y=scrollY;document.body.dataset.design=design;$("#proposal-note").textContent=notes[design];$$('[data-action="design"]').forEach(el=>el.setAttribute("aria-selected",String(el.dataset.value===design)));$("#app").innerHTML=header()+(design==="A"?renderA():design==="B"?renderB():renderC());scrollTo(0,y)}
function modal(title,content,footer=""){const d=$("#modal");d.innerHTML=`<header class="modal-head"><h2 id="modal-title">${title}</h2>${tool("关闭","close","X")}</header><div class="modal-body">${content}</div>${footer?`<footer class="modal-footer">${footer}</footer>`:""}`;if(!d.open)d.showModal()}
function closeModal(){if($("#modal").open)$("#modal").close();modalState={}}
function openImport(){modalState={type:"import",files:[]};drawImport()}
function drawImport(){modal("导入作品",`<div class="upload-zone">${icon("Upload")}<h3>添加 TXT 小说</h3>${btn("选择文件","pickFiles","","","Plus")}<span class="caption">可同时选择多部作品</span><input type="file" accept=".txt" multiple id="files" hidden></div><div>${modalState.files.map((f,i)=>`<div class="file-row">${icon("FileText")}<div><b>${escape(f.name)}</b><span class="caption">${Math.max(.1,f.size/1024).toFixed(1)} KB</span></div>${tool("移除文件","removeFile","X",i)}</div>`).join("")}</div><p class="note" style="margin-top:16px">此设计稿仅展示文件名，不读取正文，不写入软件作品库。</p>`,`${btn("取消","close")}${btn("导入作品","submitImport","","primary","Upload")}`)}
function openBooks(){modalState={type:"books"};modal("作品库",`<label class="search" style="width:100%;margin-bottom:8px">${icon("Search")}<input aria-label="搜索作品" data-input="books" placeholder="搜索作品名称"></label><div id="book-list">${bookOptions("")}</div>`,btn("导入作品","import","","","Plus"))}
function bookOptions(query){return books.map((b,i)=>({b,i})).filter(({b})=>b.title.includes(query)).map(({b,i})=>`<button class="book-option" data-action="pickBook" data-value="${i}"><span class="avatar ${i===1?"blue":i===2?"rose":""}">${b.title[0]}</span><span><strong>${b.title}</strong><span class="caption">${b.author} · ${b.chapters}章</span></span>${i===S().book?icon("Check"):""}</button>`).join("")||'<p class="empty">没有匹配的作品</p>'}
function confirmation(id){modalState={type:"confirm",id};const item=items().find(item=>item.id===id);modal("确认加入使用库",`<h3 style="font-size:18px;margin-bottom:9px">${item?.name||K().title}</h3><p class="caption">v${S().version} · ${K().label}</p><p class="note" style="margin-top:18px">仅保存已确认的规则，不自动绑定人物，不覆盖原有设定，也不自动启用文风。</p><p class="caption" style="margin-top:13px">本页为交互预览，不执行真实入库。</p>`,`${btn("继续核对","close")}${btn("确认加入","submitConfirm","","primary","Check")}`)}
function review(id){const kind=id==="xqa"?"character":S().kind,k=kinds[kind];modal("规则与依据 · "+(id==="xqa"?"许七安":k.label),`<p class="note" style="margin-bottom:18px">固定设计样例。来源内容使用情节概述展示，并非本次真实生成。</p><div class="rule-review">${k.rules.map((r,i)=>`<h3>${i+1}. ${r.title}</h3><span class="caption">适用：${r.trigger}</span><p>${r.action}</p><p class="caption">边界：${r.limit}</p><details style="margin-top:9px;font-size:12px"><summary style="cursor:pointer;color:var(--blue)">依据概述 · ${r.source}</summary><p style="margin-top:8px">${r.observation}</p></details>`).join("")}</div>`,`${btn("关闭","close")}${btn("补充修订","revise",id,"","PencilLine")}`)}
function startJob(revision=false){const s=S(),own=design;if(s.job==="running"){toast("已有模拟任务正在运行");return}if(!s.chapters.size){toast("请先选择分析章节");return}if(!s.selected.size){toast("请至少选择一类提炼目标");return}if(s.selected.has("character")&&!s.targets.size){toast("请至少选择一个目标角色");return}closeModal();s.job="running";s.revision=false;render();toast(revision?"正在演示版本修订，不调用模型":"正在演示生成流程，不调用模型");clearTimeout(timers[own]);timers[own]=setTimeout(()=>{s.job="done";s.version++;s.confirmed.clear();if(design===own){render();toast("模拟结果已更新，内容仍为固定设计样例")}},2300)}
function exportRules(){const text=`# ${K().title}\n\n> 界面设计样例，非真实模型产物。\n\n${K().rules.map(r=>`## ${r.title}\n\n触发：${r.trigger}\n\n倾向：${r.action}\n\n边界：${r.limit}`).join("\n\n")}`;const url=URL.createObjectURL(new Blob([text],{type:"text/markdown;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download=`设计样例-${K().title}.md`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function setRange(from,to){if(!Number.isInteger(from)||!Number.isInteger(to)||from<1||to<from||to>book().chapters){toast(`请输入 1-${book().chapters} 内的有效章节范围`);return}const s=S();s.from=from;s.to=to;s.chapters=new Set(Array.from({length:to-from+1},(_,i)=>from+i));render()}
function revise(id){if(design==="C"){S().revision=!S().revision;render();$("#inline-revision")?.focus();return}modalState={type:"revision",id};modal("补充修订要求",`<p class="caption" style="margin-bottom:13px">生成新版本，保留已有成果。</p><textarea id="revision-input" class="modal-textarea" aria-label="修订要求" placeholder="例如：减少绝对化判断，明确适用条件，保留性格缺点。"></textarea>`,`${btn("取消","close")}${btn("生成新版本","submitRevision","","primary","RefreshCw")}`)}
document.addEventListener("click",event=>{
 const el=event.target.closest("[data-action]");if(!el)return;const action=el.dataset.action,value=el.dataset.value,s=S();
 if(action==="design"){closeModal();design=value;location.hash=value;render();scrollTo(0,0);return}
 if(action==="close"){closeModal();return}
 if(action==="books"){openBooks();return}
 if(action==="pickBook"){s.book=Number(value);s.chapterSearch="";setRange(1,20);closeModal();toast("已切换作品；结果仍为固定设计样例");return}
 if(action==="import"){openImport();return}
 if(action==="pickFiles"){$("#files").click();return}
 if(action==="removeFile"){modalState.files.splice(Number(value),1);drawImport();return}
 if(action==="submitImport"){if(!modalState.files.length){toast("请先选择 TXT 文件");return}const count=modalState.files.length;closeModal();toast(`已演示 ${count} 部作品的导入确认，未写入任何数据`);return}
 if(action==="range"){setRange(Number($('[aria-label="起始章节"]').value),Number($('[aria-label="结束章节"]').value));return}
 if(action==="preset"){const max=book().chapters,end=Math.max(0,...s.chapters);setRange(value==="next"?Math.min(max,end+1):1,value==="all"?max:value==="next"?Math.min(max,end+20):20);return}
 if(action==="chapters"){s.chapterOpen=!s.chapterOpen;render();return}
 if(action==="selectMatches"){matches().forEach(n=>s.chapters.add(n));render();return}
 if(action==="clearChapters"){s.chapters.clear();render();return}
 if(action==="kind"){s.kind=value;s.query="";render();return}
 if(action==="focusDemand"){s.kind=value;render();return}
 if(action==="request"){s.openRequests.has(value)?s.openRequests.delete(value):s.openRequests.add(value);render();return}
 if(action==="resetDemand"){s.demands[value]=kinds[value].requirement;render();return}
 if(action==="view"){s.view=value;render();return}
 if(action==="expand"){s.expanded.has(value)?s.expanded.delete(value):s.expanded.add(value);render();return}
 if(action==="evidence"){const index=Number(value);s.evidence.has(index)?s.evidence.delete(index):s.evidence.add(index);render();return}
 if(action==="review"){review(value);return}
 if(action==="confirm"){confirmation(value);return}
 if(action==="submitConfirm"){s.confirmed.add(modalState.id);closeModal();render();toast("已确认，仅更新此设计稿状态");return}
 if(action==="added"){toast("这份样例已确认，无需重复加入");return}
 if(action==="generate"){startJob();return}
 if(action==="pause"){clearTimeout(timers[design]);if(s.job==="running"){s.job="paused";render()}else{s.job="idle";startJob()}return}
 if(action==="cancel"){clearTimeout(timers[design]);s.job="idle";render();toast("已取消模拟任务，旧结果保留");return}
 if(action==="composer"){s.composer=!s.composer;render();return}
 if(action==="revise"){revise(value);return}
 if(action==="submitRevision"){const input=$("#revision-input")||$("#inline-revision");if(!input?.value.trim()){toast("请填写修订要求");return}s.demands[s.kind]+="\n补充要求："+input.value.trim();startJob(true);return}
 if(action==="download"){exportRules();return}
 if(action==="history"){modal("任务与版本",`<div class="history-row">${icon("CircleCheck")}许七安 · 处事与判断<span class="caption">v${s.version} · 当前</span></div><div class="history-row">${icon("History")}初次分析 · 原始需求<span class="caption">v1 · 已保留</span></div><p class="note" style="margin-top:16px">以上为设计样例记录；版本号只用于演示修订流程。</p>`,btn("关闭","close"));return}
 if(action==="manage"){modal("作品管理",`<h3 style="font-size:18px;margin-bottom:8px">${book().title}</h3><p class="caption">${book().author} · ${book().chapters}章</p><div class="row" style="margin-top:20px">${btn("切换作品","books","","","BookOpen")}${btn("导入作品","import","","","Upload")}${btn("任务与版本","history","","","History")}</div>`,btn("关闭","close"));return}
});
document.addEventListener("input",event=>{
 const el=event.target,s=S();
 if(el.dataset.demand){s.demands[el.dataset.demand]=el.value;return}
 if(el.dataset.input==="results"){s.query=el.value;$("#skill-grid").innerHTML=cards();return}
 if(el.dataset.input==="chapters"){s.chapterSearch=el.value;$("#chapter-grid").innerHTML=chapterOptions();return}
 if(el.dataset.input==="books")$("#book-list").innerHTML=bookOptions(el.value);
});
document.addEventListener("change",event=>{
 const el=event.target,s=S();
 if(el.dataset.type){if(el.checked){s.selected.add(el.dataset.type);s.kind=el.dataset.type;s.openRequests.add(el.dataset.type)}else s.selected.delete(el.dataset.type);render();return}
 if(el.dataset.target){el.checked?s.targets.add(el.dataset.target):s.targets.delete(el.dataset.target);return}
 if(el.dataset.input==="pending"){s.pending=el.checked;$("#skill-grid").innerHTML=cards();return}
 if(el.dataset.input==="model"){s.model=el.value;return}
 if(el.id==="files"){modalState.files.push(...[...el.files].filter(f=>f.name.toLowerCase().endsWith(".txt")));drawImport()}
});
document.addEventListener("click",event=>{
 const el=event.target;if(!el.matches("[data-chapter]"))return;const n=Number(el.dataset.chapter),s=S();
 if(event.shiftKey&&anchor!==null){for(let i=Math.min(n,anchor);i<=Math.max(n,anchor);i++)el.checked?s.chapters.add(i):s.chapters.delete(i)}
 else el.checked?s.chapters.add(n):s.chapters.delete(n);
