*{box-sizing:border-box}body{margin:0;padding-inline:16px;background:var(--bg);color:var(--ink);font:14px/1.6 var(--body)}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 13px;transition:background .15s,transform .15s}button:hover{background:var(--soft)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.55;cursor:default}input,select,textarea{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px;max-width:100%}textarea{width:100%;resize:vertical}h1,h2,h3,p{margin:0}h1{font-size:25px;letter-spacing:-.7px}h2{font-size:19px}h3{font-size:15px}small,.muted{color:var(--muted)}small{font-size:12px}a{color:inherit}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.primary{background:var(--accent);border-color:var(--accent);color:var(--contrast)}.primary:hover{background:var(--ink);color:var(--contrast)}.plain{border:0;background:transparent}.badge{display:inline-block;font-size:11px;border-radius:5px;background:var(--soft);color:var(--accent);padding:3px 8px;white-space:nowrap}.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:3px 7px;border-radius:4px}.smallcap{font-size:10px;letter-spacing:2px;color:var(--muted)}.proposal{max-width:1480px;margin:auto;padding-block:23px 16px}.proposal strong{font-size:15px}.switcher{display:flex;gap:6px;flex-wrap:wrap}.switcher button{background:transparent;border-color:transparent}.switcher button[aria-pressed="true"]{background:var(--ink);color:var(--contrast)}.explain{max-width:1480px;margin:0 auto 19px;display:flex;justify-content:space-between;gap:20px;font-size:12px;color:var(--muted)}.window{max-width:1480px;margin:0 auto 32px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:800px}.appbar{height:53px;padding:0 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:23px;font-size:12px}.appbar .wordmark{font-family:var(--display);font-size:17px;font-weight:bold}.appbar .active{color:var(--accent);font-weight:bold}.appbar small{margin-left:auto}.workspace{display:grid;grid-template-columns:205px minmax(0,1fr)}.sidebar{padding:25px 17px;background:var(--bg);border-right:1px solid var(--line)}.sidebar .navtitle{margin:22px 10px 10px;font-size:11px;color:var(--muted)}.sidebar button{display:block;text-align:left;width:100%;margin-bottom:6px;border-color:transparent;background:transparent;padding:11px}.sidebar button.selected{background:var(--surface);border-color:var(--line);color:var(--accent)}.sidebar small{display:block;margin-top:4px}.side-note{margin-top:80px;padding:15px 9px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.main{padding:28px;min-width:0}.heading{margin-bottom:24px}.heading p{margin-top:5px;font-size:12px;color:var(--muted)}.bookstrip{padding:18px 0 24px;border-bottom:1px solid var(--line);margin-bottom:24px}.mini-cover{width:48px;height:65px;display:grid;place-items:center;background:var(--accent);color:var(--contrast);font-family:var(--display);font-size:14px;letter-spacing:3px;border-radius:2px 5px 5px 2px;flex-shrink:0}.columns{display:grid;grid-template-columns:295px minmax(0,1fr);gap:26px}.settings{padding:20px;background:var(--bg);border:1px solid var(--line);border-radius:9px}.sectiontitle{margin-bottom:18px}.field{display:block;margin:19px 0}.field>span{display:block;font-size:12px;font-weight:bold;margin-bottom:8px}.range{display:grid;grid-template-columns:1fr 16px 1fr;gap:8px;align-items:center}.range input{width:100%}.choices{display:flex;gap:7px;flex-wrap:wrap}.choices label{font-size:12px;background:var(--surface);padding:8px;border:1px solid var(--line);border-radius:6px}.choices input{accent-color:var(--accent);vertical-align:middle}.full{width:100%}.settings footer{border-top:1px solid var(--line);margin-top:20px;padding-top:16px}.result{min-width:0}.tabs{display:flex;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}.tabs button{border:0;border-radius:0;background:none;padding:0 1px 12px;color:var(--muted)}.tabs button[aria-selected="true"]{color:var(--accent);border-bottom:2px solid var(--accent);font-weight:bold}.version{font-size:11px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}.version select{font-size:11px;padding:6px}.result-title{display:flex;align-items:center;gap:12px;margin-bottom:18px}.avatar{height:43px;width:43px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-size:21px;border-radius:50%;flex-shrink:0}.result h2{font-family:var(--display);font-size:23px}.intro{font-size:13px;line-height:1.9;margin-bottom:20px}.rule{padding:17px 0;border-top:1px solid var(--line)}.rule h3{margin-bottom:10px}.rule dl{display:grid;grid-template-columns:63px minmax(0,1fr);gap:9px 12px;font-size:12px;margin:0}.rule dt{color:var(--muted)}.rule dd{margin:0;line-height:1.85}.evidence{margin-top:14px;font-size:12px}.evidence summary{cursor:pointer;color:var(--accent)}blockquote{background:var(--bg);padding:15px;margin:12px 0 0;border-left:2px solid var(--line);line-height:1.9}.result-actions{border-top:1px solid var(--line);margin-top:10px;padding-top:20px}.task{padding:12px 15px;background:var(--soft);border-radius:6px;margin-top:18px;font-size:12px}.task button{font-size:11px;padding:3px 8px}.bookgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:24px 0 32px}.bookcard{text-align:left;padding:0;border-radius:8px;overflow:hidden;background:var(--surface)}.cover{height:195px;position:relative;padding:23px;background:var(--soft);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;border-bottom:1px solid var(--line)}.cover:after{content:"";position:absolute;inset:12px;border:1px solid currentColor;opacity:.17;pointer-events:none}.cover .cover-title{font:27px/1.4 var(--display);letter-spacing:4px;max-width:120px}.cover small{color:inherit;font-size:10px;letter-spacing:2px}.bookcard:nth-child(2) .cover{background:var(--ink);color:var(--contrast)}.bookcard:nth-child(3) .cover{background:var(--bg);color:var(--accent)}.bookcard:nth-child(4) .cover{background:var(--line);color:var(--ink)}.cardinfo{padding:15px}.cardinfo strong{display:block;margin-bottom:6px}.cardinfo .row{margin-top:14px;gap:5px}.shelf-top{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:35px;padding:8px 0 27px;border-bottom:1px solid var(--line)}.shelf-top h1{font:32px var(--display);margin:8px 0 12px}.resume{background:var(--bg);padding:18px;border-radius:8px;border:1px solid var(--line)}.resume p{font-size:12px;margin:7px 0 14px}.listrow{padding:16px 0;border-top:1px solid var(--line);font-size:13px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}.reading{display:grid;grid-template-columns:185px minmax(0,1fr) 275px;min-height:715px}.outline{padding:27px 17px;border-right:1px solid var(--line)}.outline button{width:100%;text-align:left;background:transparent;border:0;font-size:12px;margin-top:5px}.outline button.selected{background:var(--soft);color:var(--accent)}.outline h3{font-size:12px;margin:20px 10px 8px}.manuscript{padding:35px 38px;min-width:0}.manuscript .intro{font-size:15px;line-height:2}.manuscript h2{font-size:32px}.manuscript .rule{padding:24px 0}.manuscript .rule dd{font-size:13px}.source{padding:28px 20px;background:var(--bg);border-left:1px solid var(--line)}.source blockquote{padding:0;border:0;font-family:var(--display);font-size:14px;line-height:2.2;margin:20px 0}.source hr{border:0;border-top:1px solid var(--line);margin:24px 0}.source p{font-size:12px;line-height:1.9}.toolbar{padding:17px 24px;border-bottom:1px solid var(--line)}.toolbar h1{font-size:18px}.mode-c{--bg:#e9edf2;--surface:#fdfefe;--ink:#273d53;--muted:#718094;--line:#dce3eb;--accent:#416887;--soft:#eaf0f6}.mode-b{--bg:#f0f2ec;--surface:#fdfefb;--ink:#354333;--muted:#76816e;--line:#dfe4d7;--accent:#637844;--soft:#eaf0df}.note{font-size:11px;color:var(--muted);margin-top:15px}.empty{padding:35px;color:var(--muted);text-align:center}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--contrast);padding:12px 22px;border-radius:8px;z-index:20;max-width:calc(100% - 32px)}dialog{width:520px;max-width:calc(100% - 32px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:25px}dialog::backdrop{background:color-mix(in srgb,var(--ink) 30%,transparent)}dialog p{font-size:12px;color:var(--muted);margin:12px 0 20px}[hidden]{display:none!important}.modal-upload{border:1px dashed var(--line);padding:25px;text-align:center;margin:20px 0}.mobile-label{display:none}main,section,aside,article{min-width:0}
@media(min-width:1500px){.window{min-height:850px}.main{padding:32px 40px}.columns{gap:35px;grid-template-columns:310px minmax(0,1fr)}}@media(max-width:1100px){.workspace{grid-template-columns:165px minmax(0,1fr)}.columns{grid-template-columns:245px minmax(0,1fr);gap:20px}.main{padding:22px}.reading{grid-template-columns:145px minmax(0,1fr)}.source{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.bookgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.shelf-top{grid-template-columns:1fr}.side-note{margin-top:35px}}@media(max-width:760px){.proposal{align-items:flex-start;gap:14px}.proposal,.explain{flex-direction:column}.explain{gap:6px}.workspace{display:block}.sidebar{display:none}.main{padding:20px 16px}.columns{grid-template-columns:1fr}.settings{padding:17px}.appbar{padding:0 16px;gap:17px}.appbar .secondary{display:none}.appbar small{font-size:10px}.window{border-radius:8px}.heading{gap:12px}.bookgrid{gap:12px}.cover{height:175px;padding:20px}.cover .cover-title{font-size:23px}.reading{display:block}.outline{display:none}.manuscript{padding:24px 18px}.toolbar{padding:16px}.toolbar .row{gap:8px}.result h2{font-size:24px}.source{padding:22px 18px}.switcher button{padding:8px 10px;font-size:12px}.bookstrip .row{gap:10px}.rule dl{grid-template-columns:55px minmax(0,1fr)}.shelf-top h1{font-size:28px}.mobile-label{display:block}.version{align-items:flex-start}}

</style>
<header class="proposal row between"><div><strong>拆书库 / UI 设计提案</strong><div class="smallcap">INTERACTIVE CONCEPTS · 仅预览，不改源码</div></div><nav class="switcher" aria-label="设计方案"><button data-mode="a" aria-pressed="true">A · 清爽工作台</button><button data-mode="b" aria-pressed="false">B · 作品书架</button><button data-mode="c" aria-pressed="false">C · 沉浸研读</button></nav></header>
<div class="explain"><span id="description">设置与结果双栏并置，减少上下翻找。延续当前绿色系，适合高频操作。</span><span>所有书名、人物、分析内容均为虚构示例</span></div>
<div id="app" class="window"></div>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="row between"><h2 id="dialog-title">导入作品</h2><button id="close-dialog" aria-label="关闭弹窗">×</button></div><div id="dialog-content"></div></dialog>
<script>
const $=s=>document.querySelector(s);let mode='a',tab='角色',selected='雾港来信',paused=false;
const books=[{name:'雾港来信',type:'悬疑 · 群像',chapters:128,words:'38.6',state:'待确认',desc:'一封迟到的信，一座不愿醒来的城。'},{name:'长山行',type:'仙侠 · 成长',chapters:216,words:'65.2',state:'已入库',desc:'山路漫长，少年与自己的约定。'},{name:'昨日星河',type:'科幻 · 冒险',chapters:96,words:'28.4',state:'已入库',desc:'从废弃的观测站，重新寻找星空。'},{name:'南风有期',type:'都市 · 情感',chapters:82,words:'24.1',state:'未分析',desc:'在平凡日子里，练习认真告别。'}];
const descriptions={a:'设置与结果双栏并置，减少上下翻找。延续当前绿色系，适合高频操作。',b:'以作品为入口，用书架组织拆书资料。适合多部作品的浏览、切换与管理。',c:'分析结果居中，原文依据在右，设置按需展开。适合长时间研读与人工复核。'};
function appbar(){return '<div class="appbar"><span class="wordmark">创作空间</span><span class="secondary">工作区</span><span class="active">拆书库</span><span class="secondary">使用库</span><small>独立设计原型 · 示例内容</small></div>'}
function sidebar(){return '<aside class="sidebar"><div class="smallcap" style="padding:0 10px">BOOK ANALYSIS</div><div class="navtitle">我的作品</div>'+books.map(b=>'<button data-book="'+b.name+'" class="'+(selected===b.name?'selected':'')+'">'+b.name+'<small>'+b.chapters+' 章 · '+b.state+'</small></button>').join('')+'<button data-action="import">＋ 导入作品</button><div class="side-note">从阅读，到创作。<br>将角色、故事和文风<br>整理为可复用的素材。</div></aside>'}
function settings(id='a'){return '<section class="settings"><div class="row between sectiontitle"><h3>分析设置</h3><span class="badge">新任务</span></div><label class="field"><span>章节范围</span><div class="range"><input id="start-'+id+'" aria-label="起始章节" type="number" min="1" max="128" value="1"><span>至</span><input id="end-'+id+'" aria-label="结束章节" type="number" min="1" max="128" value="20"></div></label><small>按章节选择分析范围，不影响原文件。</small><label class="field"><span>分析内容</span></label><div class="choices">'+['角色','故事','文风'].map((x,i)=>'<label><input id="skill-'+id+'-'+i+'" type="checkbox" '+(i===0?'checked':'')+'> '+x+'</label>').join('')+'</div><label class="field" for="model-'+id+'"><span>分析模型</span><select id="model-'+id+'" class="full"><option>跟随全局配置</option><option>自定义模型（示例）</option></select></label><label class="field" for="request-'+id+'"><span>补充要求 <small>可选</small></span><textarea id="request-'+id+'" rows="3" placeholder="例如：重点观察角色在冲突中的决策方式"></textarea></label><footer><button class="primary full" data-action="start">开始分析 →</button><p class="note">先生成结果，确认后才加入使用库。</p></footer></section>'}
const content={角色:{name:'林照',subtitle:'主角 · 港口档案员',intro:'以谨慎克制为外在表现，以寻找真相为内在驱动。角色的张力来自「想要知道」与「不愿牵连他人」之间的持续拉扯。',title:'让行动先于情绪表态',condition:'角色面对不确定的风险，且尚未获得足够信任。',action:'先通过收存证据、核对细节等小动作表达立场，再以简短对话补足动机；避免直接宣告性格。',boundary:'危机已经威胁他人时，不宜继续延迟决策，以免削弱角色行动力。',quote:'林照把信折回原样，没有问是谁送来的。他先看了一眼门外，又把那枚沾着盐霜的邮戳转向灯光。'},故事:{name:'雾港疑云',subtitle:'故事结构 · 开篇推进',intro:'用一封来历不明的信建立核心疑问，让信息缺口推动行动。每次线索揭示同时改变角色对港口旧事的判断。',title:'以答案引出下一层问题',condition:'单条线索已被验证，故事需要进入新的调查阶段。',action:'解答当前疑问的一部分，同时引入与已有认知冲突的新证据，保持主线连续。',boundary:'新问题应与主线有关，避免无关联悬念积累。',quote:'信里的日期没有写错。错的是档案室里那本所有人都翻过的登记册。'},文风:{name:'克制的悬疑叙事',subtitle:'文风观察 · 环境与动作',intro:'通过物件、光线和动作承载情绪，减少抽象形容。短句用于收束发现，较长句用于铺陈空间与观察。',title:'用可见细节承载紧张感',condition:'场景需要表现不安，但尚未发生直接冲突。',action:'选择一个异常的感官细节，让角色对它做出微小反应，用环境变化代替情绪说明。',boundary:'不必让所有物件都承担隐喻；紧张场景之间需要保留节奏缓冲。',quote:'走廊的灯灭了一盏。门缝里的光短了一截，他握着信的手没有松开。'}};
function result(reading=false){const c=content[tab];return '<article class="result"><div class="tabs" role="tablist" aria-label="分析结果">'+['角色','故事','文风'].map(t=>'<button role="tab" aria-selected="'+(tab===t)+'" data-tab="'+t+'">'+t+(t==='角色'?'分析':t==='故事'?'结构':'特征')+'</button>').join('')+'</div><div class="version"><span class="badge">自动核验通过 · 待确认</span><label>结果版本 <select id="version" aria-label="结果版本"><option>v2 · 最新版本</option><option>v1 · 初始版本</option></select></label></div><div class="result-title"><div class="avatar">'+c.name[0]+'</div><div><h2>'+c.name+'</h2><small>'+c.subtitle+'</small></div></div><p class="intro">'+c.intro+'</p><div class="row" style="margin-bottom:20px"><span class="tag">第 1–20 章</span><span class="tag">基于原文观察</span><span class="tag">需人工复核</span></div><section class="rule"><h3>'+c.title+'</h3><dl><dt>适用情境</dt><dd>'+c.condition+'</dd><dt>复用规则</dt><dd>'+c.action+'</dd><dt>例外边界</dt><dd>'+c.boundary+'</dd></dl><details class="evidence" '+(reading?'open':'')+'><summary>查看原文依据 · 第 3 章</summary><blockquote>'+c.quote+'<br><small>虚构示例原文 · 用于展示证据回溯</small></blockquote></details></section><section class="rule"><h3>在关系变化中呈现不同侧面</h3><p class="muted" style="font-size:12px;line-height:1.9">面对熟人时保留试探性的幽默，面对陌生人时使用简短回应。通过对话差异呈现关系，而非重复描述人物标签。</p></section><div class="result-actions row between"><button data-action="revise">补充要求 · 生成修订</button><button class="primary" data-action="confirm">确认并加入使用库</button></div><p class="note">确认不会自动绑定人物或启用文风，旧版本仍会保留。</p></article>'}
function task(){return '<div class="task row between"><span>● <span id="task-label">文风分析中</span> <span class="muted">· 第 21–40 章 · 已完成 3 / 5 区块</span></span><button data-action="pause">'+(paused?'继续':'暂停')+'</button></div>'}
function render(){document.body.className='mode-'+mode;$('#description').textContent=descriptions[mode];document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));const book=books.find(b=>b.name===selected);if(mode==='a'){$('#app').innerHTML=appbar()+'<div class="workspace">'+sidebar()+'<main class="main"><header class="heading row between"><div><h1>拆书工作台</h1><p>把阅读中的发现，变成写作时可用的经验。</p></div><button class="primary" data-action="import">＋ 导入作品</button></header><section class="bookstrip row between"><div class="row"><div class="mini-cover">'+selected.slice(0,2)+'</div><div><h2>'+selected+'</h2><small>'+book.type+'　/　'+book.chapters+' 章　/　'+book.words+' 万字</small></div></div><button class="plain" data-action="history">历史任务 ↗</button></section><div class="columns">'+settings()+result()+'</div>'+task()+'</main></div>'}else if(mode==='b'){$('#app').innerHTML=appbar()+'<div class="workspace">'+sidebar()+'<main class="main"><section class="shelf-top"><div><div class="smallcap">YOUR READING COLLECTION</div><h1>读过的故事，留下的技法。</h1><p class="muted">把每一本书，整理成自己的创作参考。</p><div class="row" style="margin-top:20px"><button class="primary" data-action="import">＋ 导入新作品</button><button data-action="history">导入与分析记录</button></div></div><aside class="resume"><small>继续上次的拆书</small><h3 style="margin-top:8px">雾港来信 · 角色分析</h3><p>第 1–20 章的结果已生成，等待你复核。</p><button data-open="雾港来信">继续查看 →</button></aside></section><div class="row between" style="margin-top:25px"><h2>全部作品 <small>4 本</small></h2><input id="search" type="search" aria-label="搜索作品" placeholder="搜索作品名称…"></div><section class="bookgrid" id="bookgrid">'+books.map((b,i)=>'<button class="bookcard" data-open="'+b.name+'" data-name="'+b.name+'"><div class="cover"><small>拆书笔记 / '+b.type.split(' · ')[0]+'</small><div class="cover-title">'+b.name+'</div><small>READ · OBSERVE · CREATE</small></div><div class="cardinfo"><strong>'+b.name+'</strong><small>'+b.chapters+' 章 · '+b.words+' 万字</small><div class="row"><span class="badge">'+b.state+'</span><span class="tag">'+(i===3?'开始拆书':'查看分析 →')+'</span></div></div></button>').join('')+'</section><p id="no-results" class="empty" hidden>未找到匹配作品，请尝试其他书名。</p><div class="row between"><h2>最近整理</h2><small>按更新时间</small></div><div class="listrow"><div><strong>林照 · 角色行为规则</strong><br><small>雾港来信 / 角色分析 / v2</small></div><span class="badge">待确认入库</span><button data-open="雾港来信">复核结果 →</button></div><div class="listrow"><div><strong>成长型主线 · 故事结构</strong><br><small>长山行 / 故事分析 / v1</small></div><span class="tag">已加入故事框架库</span><button data-open="长山行">查看作品 →</button></div><p class="note">书架视图为新的入口组织方式；点击书卡进入工作台预览。</p></main></div>'}else{$('#app').innerHTML=appbar()+'<header class="toolbar row between"><div class="row"><button class="plain" data-action="shelf">← 作品</button><h1>'+selected+'</h1><span class="tag">第 1–20 章</span></div><div class="row"><button data-action="history">版本记录</button><button class="primary" data-action="settings">新建分析</button></div></header><div class="reading"><aside class="outline"><div class="smallcap" style="padding-left:10px">阅读目录</div><h3>分析维度</h3>'+['角色','故事','文风'].map(t=>'<button data-tab="'+t+'" class="'+(tab===t?'selected':'')+'">'+t+'分析</button>').join('')+'<h3>本页内容</h3><button data-action="top">分析概述</button><button data-action="evidence">规则与原文依据</button><div class="side-note">已读取第 1–20 章<br>自动核验不能替代<br>你的判断。</div></aside><main class="manuscript">'+result(true)+'</main><aside class="source"><div class="row between"><h3>原文旁注</h3><span class="tag">第 3 章</span></div><small>海风中的邮戳 · 示例章节</small><blockquote>'+content[tab].quote+'</blockquote><span class="badge">当前规则的观察依据</span><hr><h3>复核时可以关注</h3><p style="margin-top:12px">这条规则是否有足够证据？<br>是否只适用于特定情境？<br>复用时需要保留哪些边界？</p><hr><h3>来源与版本</h3><p style="margin-top:10px">作品：'+selected+'<br>范围：第 1–20 章<br>结果：v2 · 最新版本</p><p class="note">右侧证据对照为布局提案，非当前业务功能的真实运行。</p></aside></div>'} }
let toastTimer;function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
function modal(title,html){$('#dialog-title').textContent=title;$('#dialog-content').innerHTML=html;$('#dialog').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mode){mode=b.dataset.mode;render();return}if(b.dataset.book){selected=b.dataset.book;render();return}if(b.dataset.open){selected=b.dataset.open;mode='a';render();window.scrollTo({top:0});toast('已打开作品工作台。分析内容为统一示例，不代表该书实际结果。');return}if(b.dataset.tab){tab=b.dataset.tab;render();return}const a=b.dataset.action;if(a==='import')modal('导入作品','<p>这是导入交互预览，文件不会上传或写入项目。</p><div class="modal-upload"><label for="file">选择本地 TXT 文件</label><br><input style="margin-top:15px;width:100%" id="file" type="file" accept=".txt"></div><button class="primary full" data-action="import-demo">体验导入反馈</button>');if(a==='import-demo'){toast($('#file')?.files.length?'已选择文件；预览模式不读取或导入内容。':'请先选择一个 TXT 文件。');}if(a==='settings')modal('新建分析','<p>只展示设置交互，不会调用模型。</p>'+settings('dialog'));if(a==='start'){const scope=b.closest('.settings'),start=Number(scope.querySelector('[id^="start-"]').value),end=Number(scope.querySelector('[id^="end-"]').value);if(start<1||end<start||end>128){toast('请设置 1–128 章内的有效范围，结束章不能小于起始章。');return}if(!scope.querySelector('input[type="checkbox"]:checked')){toast('请至少选择一种分析内容。');return}toast('设置已检查：第 '+start+'–'+end+' 章。仅演示，不会创建真实任务。');}if(a==='confirm')modal('确认加入使用库','<p>将当前'+tab+'分析结果加入'+(tab==='角色'?'角色灵魂库':tab==='故事'?'故事框架库':'文风库')+'。不会自动绑定人物或启用文风。</p><div class="row between"><small>设计演示，不产生真实数据</small><button class="primary" data-action="confirm-demo">确认入库</button></div>');if(a==='confirm-demo'){$('#dialog').close();toast('确认入库交互已演示，项目数据未改变。')}if(a==='revise')modal('补充修订要求','<p>保留旧结果，根据补充要求生成新的结果版本。</p><label for="revision">需要如何调整？</label><textarea id="revision" rows="4" placeholder="例如：补充规则不适用的情境"></textarea><button style="margin-top:16px" class="primary" data-action="revise-demo">生成修订版本</button>');if(a==='revise-demo'){if(!$('#revision').value.trim()){toast('请填写修订要求。');return}$('#dialog').close();toast('修订交互已演示，未调用模型。')}if(a==='pause'){paused=!paused;b.textContent=paused?'继续':'暂停';$('#task-label').textContent=paused?'任务已暂停':'文风分析中';}if(a==='history')modal('任务与版本记录','<p>以下是用于界面展示的虚构记录。</p><div class="listrow"><span>角色分析 · 第 1–20 章<br><small>v2 · 补充例外边界</small></span><span class="badge">待确认</span></div><div class="listrow"><span>角色分析 · 第 1–20 章<br><small>v1 · 初始版本</small></span><span class="tag">已保留</span></div><div class="listrow"><span>文风分析 · 第 21–40 章</span><span class="badge">分析中</span></div>');if(a==='shelf'){mode='b';render()}if(a==='top')$('.manuscript').scrollIntoView({block:'start'});if(a==='evidence')$('.evidence').scrollIntoView({block:'center'});});
$('#close-dialog').onclick=()=>$('#dialog').close();document.addEventListener('input',e=>{if(e.target.id==='search'){let n=0;document.querySelectorAll('.bookcard').forEach(c=>{c.hidden=!c.dataset.name.includes(e.target.value.trim());if(!c.hidden)n++});$('#no-results').hidden=n>0}});document.addEventListener('change',e=>{if(e.target.id==='version')toast('已选择 '+e.target.value+'；此原型仅提供一份示例结果。')});render();
</script>
