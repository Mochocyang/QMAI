name = "qmai-account"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# 自定义域名：`*.workers.dev` 在国内会被 DNS 污染（实测解析到微软的 IP、直连超时），
# 绑自有域名后国内直连可通。workers.dev 仍保留作为兜底入口（老客户端会话里存的是它）。
workers_dev = true
routes = [
  { pattern = "account.qmai.pro", custom_domain = true },
  # 百度网盘 OAuth 回调。百度开放平台【安全设置】里登记的是
  # https://qmai.pro/oauth/baidu/callback，所以这个子路径必须由本 Worker 接管。
  # 只精确匹配 /oauth/baidu/*，不碰 qmai.pro 的其它路径（那里是 Pages 站点）。
  { pattern = "qmai.pro/oauth/baidu/*", zone_name = "qmai.pro" },
  # 隐私政策与服务条款：开放平台公开发布要求可访问的正式链接。
  # 只精确匹配这两条路径，站点其它页面仍由 Pages 提供。
  { pattern = "qmai.pro/privacy", zone_name = "qmai.pro" },
  { pattern = "qmai.pro/terms", zone_name = "qmai.pro" }
]

# D1: account data kept separate from analytics-worker and New API gateway.
[[d1_databases]]
binding = "DB"
database_name = "qmai-account-db"
database_id = "968a6a50-80bb-40da-881f-b39b751e4921"

[vars]
# Email channel: resend (free tier, 100/day, requires a verified sending domain).
# To switch to Workers Paid send_email binding, set "cloudflare" and add [[send_email]].
EMAIL_PROVIDER = "resend"
AUTH_EMAIL_FROM = "青幕AI写作 <no-reply@qmai.pro>"
# Production only allows the two Tauri origins; local dev origins go in .dev.vars.
APP_ALLOWED_ORIGINS = "tauri://localhost,https://tauri.localhost"
ENVIRONMENT = "production"
# Workers Free has a tight CPU budget; 100000 iterations is the safe ceiling.
PASSWORD_ITERATIONS = "100000"
# Keep "false" in production; only local debugging may set "true".
ALLOW_DEV_CODE = "false"

# --- 百度网盘开放平台 ---
# AppKey 是公开标识（等同 OAuth 的 client_id），放 vars 没问题。
# 对应应用：青幕AI写作 / AppID 124537589 / 软件·公开发布。
BAIDU_APP_KEY = "DF39UZkTVpx8M0C9kgsi7Xzlm4M3nntO"
# 回调地址必须与百度后台【安全设置】里登记的**完全一致**（含路径与结尾）。
BAIDU_REDIRECT_URI = "https://qmai.pro/oauth/baidu/callback"
# 授权模式：general = 通用授权（basic,netdisk，已开通）；
# dir = 目录级授权（nd_open_read,nd_open_write，需应用先获得该权限）。
# 目录级授权申请下来后，把这里改成 "dir" 并重新部署即可，不用改代码。
BAIDU_AUTH_MODE = "general"
# SecretKey 绝不写在这里 —— 用 `wrangler secret put BAIDU_APP_SECRET` 注入。

# Daily cleanup: rate limit buckets older than 24h, codes older than 7d, sessions 30d past expiry.
[triggers]
crons = ["17 3 * * *"]
