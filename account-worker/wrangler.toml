name = "qmai-account"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# D1: account data kept separate from analytics-worker and New API gateway.
[[d1_databases]]
binding = "DB"
database_name = "qmai-account-db"
database_id = "968a6a50-80bb-40da-881f-b39b751e4921"

[vars]
# Email channel: resend (free tier, 100/day, requires a verified sending domain).
# To switch to Workers Paid send_email binding, set "cloudflare" and add [[send_email]].
EMAIL_PROVIDER = "resend"
AUTH_EMAIL_FROM = "青幕AI写作 <no-reply@qmai.pro>"
# Production only allows the two Tauri origins; local dev origins go in .dev.vars.
APP_ALLOWED_ORIGINS = "tauri://localhost,https://tauri.localhost"
ENVIRONMENT = "production"
# Workers Free has a tight CPU budget; 100000 iterations is the safe ceiling.
PASSWORD_ITERATIONS = "100000"
# Keep "false" in production; only local debugging may set "true".
ALLOW_DEV_CODE = "false"

# Daily cleanup: rate limit buckets older than 24h, codes older than 7d, sessions 30d past expiry.
[triggers]
crons = ["17 3 * * *"]
