[package]
name = "qmai-setup-shell"
version = "0.1.0"
edition = "2021"
publish = false
description = "青幕AI写作 安装器动效壳"

[[bin]]
name = "QmaiSetupUI"
path = "src/main.rs"

# 刻意**不**接入 src-tauri 的 workspace / target 目录：
# 这是一个独立产物，独立依赖、独立 target，编译失败或依赖冲突
# 都不会影响主程序与安装包的正常打包。

[build-dependencies]
# 把软件图标编进 QmaiSetupUI.exe 的 Windows 资源段。
# 少了它，Windows 任务栏和资源管理器只能显示系统默认图标。
embed-resource = "3"

[dependencies]
wry = "0.55"
tao = "0.35"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
